###########################################################################
# SonarQube properties
#  Free Rubens Gomes GitHub Org / Projects
# Key: rubensgomes-org
#
# Consumed by:
#   - .github/workflows/main-verify.yml, the sonar job (every push to main)
#   - .github/workflows/release.yml, Step 7 (the release-blocking gate)
#   - `make sonar`, the local fallback that runs the identical scan
#
# All three read THIS file and pass no scanner arguments of their own, so they
# cannot drift. Change analysis scope here, never in a workflow.
#
# PREREQUISITE: "Automatic Analysis" must stay DISABLED for this project in
# SonarCloud (Administration -> Analysis Method). Automatic Analysis and
# CI-based analysis are mutually exclusive; with both on, every CI scan fails
# with "You are running CI analysis while Automatic Analysis is enabled".
###########################################################################
sonar.host.url=https://sonarcloud.io
sonar.organization=rubensgomes-org
sonar.projectName=azure-iac
sonar.projectKey=rubensgomes-org_azure-iac
sonar.qualitygate.wait=true

# Pin the analysis to main, for all three callers.
#
# This repo is trunk-based: every commit lands on main directly, there are no
# feature branches and no pull requests, so `main` is the only value that is
# ever correct. Pinning it here rather than passing -Dsonar.branch.name from
# each caller keeps the "no scanner arguments in the workflow" rule at the top
# of this file absolute -- main-verify.yml, release.yml and `make sonar` all
# invoke the scanner with no arguments at all and therefore cannot drift.
#
# It is not merely cosmetic for release.yml. That workflow is triggered by a
# TAG push, so GITHUB_REF is refs/tags/vX.Y.Z; without an explicit branch the
# scanner turns that ref into a SHORT-lived branch literally named
# "refs/tags/v0.3.0", the submit succeeds, and then the gate lookup
# (api/qualitygates/project_status?analysisId=...) returns 403, because
# short-lived branch gate status is not readable on this plan. The scanner
# reports that as "Not authorized or project not found ... check the
# 'SONAR_TOKEN' environment variable" and sends you hunting for a token problem
# that does not exist. It also litters a junk branch into the project per tag.
# That is what cost the v0.3.0 release; see CHANGELOG.md [0.3.1].
#
# This line was removed in 0.4.0, when the repo briefly ran a PR-only model and
# a global pin would have made every PR analysis overwrite main's. That model
# is gone; the pin is correct again. Restore the per-caller arguments only if
# pull requests ever come back.
sonar.branch.name=main
sonar.sources=.
sonar.inclusions=**/*.tf,**/*.yaml,**/*.yml
sonar.sourceEncoding=UTF-8
# SONAR_TOKEN must be defined as an environment variable

# Step 5 of release.yml runs `make validate`, which inits all twelve module
# roots and leaves .terraform/ behind -- and because every module root sources
# its child module from ../../modules/<name>, .terraform/modules/ holds a COPY
# of those .tf files. Without this exclusion sonar.sources=. indexes both
# copies: the estate is double-counted, ncloc roughly doubles, and every module
# raises each finding twice. Same reason for .scannerwork/, which the scanner
# writes into the repo root as it runs.
sonar.exclusions=**/.terraform/**,**/.scannerwork/**

# githubactions:S7637 wants a full commit SHA on every `uses:`. This repo pins
# major version tags on purpose (actions/checkout@v7, hashicorp/setup-terraform@v4,
# ...; the convention is documented in CLAUDE.md), trading the supply-chain
# guarantee of an immutable SHA for automatic patch and security uptake. Every
# action used here is first-party: actions/*, hashicorp/*, azure/*, SonarSource/*.
#
# Suppressed HERE rather than by deactivating the rule in the SonarCloud quality
# profile, so the trade-off is version-controlled, greppable, and shows up in a
# diff if someone revisits it. Note this also covers the scan action's own pin --
# without it, adding the gate to release.yml would raise a finding that fails
# the very gate being added.
#
# e2-e4: terraform:S6378, "omitting the identity block disables Azure Managed
# Identities". Not applicable to these three resources. This estate's
# passwordless model (PROVISIONING_PLAN.md §12) has the APPLICATION authenticate
# TO Storage and ACR using one shared USER-ASSIGNED identity attached to the
# container apps -- `AcrPull` and the blob data roles are granted to that UAMI.
# The registry and the storage accounts are the targets of that auth, not
# callers of anything, so a service-side identity on them would serve nothing.
#
# e5: terraform:S6382, client certificate authentication on container app
# ingress. Deliberately not enabled: this is a public learning playground and
# mTLS on the front door is not part of the design.
#
# NOTE these four are pinned to EXACT file paths, not a `terraform/**` glob. A
# new module that omits an identity block, or new ingress that skips client
# certs, must still raise the finding and be judged on its own merits -- the
# exemption is for these specific resources, not for the rule.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/*.yml
sonar.issue.ignore.multicriteria.e2.ruleKey=terraform:S6378
sonar.issue.ignore.multicriteria.e2.resourceKey=terraform/bootstrap-backend/main.tf
sonar.issue.ignore.multicriteria.e3.ruleKey=terraform:S6378
sonar.issue.ignore.multicriteria.e3.resourceKey=terraform/modules/acr/main.tf
sonar.issue.ignore.multicriteria.e4.ruleKey=terraform:S6378
sonar.issue.ignore.multicriteria.e4.resourceKey=terraform/modules/storage/main.tf
sonar.issue.ignore.multicriteria.e5.ruleKey=terraform:S6382
sonar.issue.ignore.multicriteria.e5.resourceKey=terraform/modules/container-apps/main.tf
