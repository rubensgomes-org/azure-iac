# =============================================================================
# Release (tag push)
#
# Purpose:
#   Validates and publishes a release when a semver tag is pushed. It is the
#   gate that keeps a tag honest: the tag name, the VERSION file, and the
#   CHANGELOG entry must all agree, and the whole estate must still parse and
#   validate, before a GitHub Release appears.
#
# Trigger:
#   push of a tag matching v*.*.* — normally produced by:
#       make release-minor      (bump, roll changelog, commit, tag; LOCAL)
#       make release-push       (pushes main + the tag; fires this workflow)
#
#   Also workflow_dispatch, which exists for ONE reason: an Actions input has
#   to hang off a dispatch trigger, and `run_sonar` is that input. A tag push
#   cannot supply one, so on the normal path `inputs` is empty and the Sonar
#   steps skip. Dispatching from a branch fails step 2 straight away (the ref
#   name is not v$(cat VERSION)); dispatch from the TAG ref when you want to
#   re-run a release with the gate on.
#
# Authentication:
#   This workflow deliberately holds no Azure credentials and is not bound to
#   the "AZURE" GitHub Environment. `terraform validate` runs with
#   -backend=false, so nothing here reaches the subscription. Cutting a
#   release must never be able to mutate the estate — applying stays a
#   deliberate `make apply` from a workstation.
#
#   The one secret it does hold is SONAR_TOKEN (step-scoped, organization
#   Actions secret on rubensgomes-org), read only by the two opt-in Sonar
#   steps and so not read at all on a bare tag push. It is a SonarCloud
#   analysis token: it reaches sonarcloud.io and nothing else, and cannot
#   touch the Azure subscription. The no-Azure-credentials rule is unchanged
#   — keep it that way.
#
# Notes:
#   - terraform_version must satisfy the `required_version = ">= 1.16.0, < 2.0"`
#     declared in every versions.tf in the repo. Every Terraform-touching
#     workflow in this directory pins the same build; bump them together.
#   - `gh` is preinstalled on ubuntu-latest, so the release is published with
#     the CLI rather than a third-party action. GH_TOKEN comes from the
#     built-in github.token, which the `contents: write` permission below
#     upgrades enough to create a release.
#   - The Sonar quality gate (steps 6 and 7) is OPT-IN and OFF by default.
#     Both steps carry `if: ${{ inputs.run_sonar }}`, and a tag push supplies
#     no inputs at all, so the ordinary release path skips them and publishes
#     without a Sonar analysis. Nothing else in this workflow is conditional.
#   - When it IS asked for, the gate still blocks. Every scanner setting lives
#     in sonar-project.properties at the repo root, including the
#     `sonar.qualitygate.wait=true` that makes it blocking and the
#     `sonar.branch.name=main` that stops a tag push being analysed as a
#     short-lived branch. This workflow passes the scanner no arguments of its
#     own. Never add `continue-on-error` to that step: having asked for the
#     gate, publishing over a red one defeats the point of having it.
#   - Because the gate is opt-in on BOTH sides now -- here and in
#     main-verify.yml, whose sonar job is likewise off unless run_sonar=true
#     -- a release commit can reach a published Release having never been
#     scanned. If you want the analysis, run
#     `gh workflow run main-verify.yml --ref main -f run_sonar=true` before
#     tagging, which is the cheaper place to find out.
# =============================================================================

name: Release (tag push)

on:
  push:
    tags:
      - "v*.*.*"

  # Manual re-run, carrying the one knob this workflow has. See the Trigger
  # note above for why a dispatch trigger exists here at all.
  workflow_dispatch:
    inputs:
      # -----------------------------------------------------------------------
      # run_sonar
      #
      # Defaults to false, so the SonarCloud scan and its blocking quality gate
      # are skipped unless someone deliberately ticks the box. A tag push --
      # the normal trigger -- carries no inputs, which reads as false here and
      # skips them too.
      #
      # Setting it true adds a full SonarCloud analysis, the org-level
      # SONAR_TOKEN, a network round trip, and a PUBLISHED analysis that
      # overwrites main's quality gate status; a red gate then stops the
      # release from being published.
      #
      # `type: boolean` renders a checkbox and arrives in the `inputs` context
      # as a real boolean, so the `if:` on steps 6 and 7 needs no string
      # comparison.
      # -----------------------------------------------------------------------
      run_sonar:
        description: "Also run the SonarCloud scan (blocking quality gate)"
        required: false
        type: boolean
        default: false

permissions:
  # contents: write is required to create the GitHub Release. Everything else
  # stays at the default of none.
  contents: write

concurrency:
  # Keyed on the tag, so two different releases never serialise behind each
  # other, but a re-run of the same tag cannot race itself.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest

    # No ceiling existed here before the Sonar gate landed. Step 7, when
    # run_sonar is true, blocks waiting on SonarCloud to finish computing the
    # gate, which is exactly the kind of step that can hang, so give the job
    # the same kind of ceiling the other workflows in this directory carry.
    timeout-minutes: 20

    env:
      # Tell Terraform it's running in CI (avoids interactive prompts / improves logs)
      TF_IN_AUTOMATION: "true"

      # The pushed tag, e.g. "vX.Y.Z". github.ref_name is the short ref.
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository content
      #
      # fetch-depth: 0 so the full history and every tag are present — needed
      # if you ever want to diff against the previous release from here.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Step 2: Consistency gate (fail fast, before anything expensive)
      #
      # Why:
      #   `make release-<level>` keeps the tag, VERSION, and CHANGELOG in sync
      #   by construction. A tag cut by hand — or one moved after the fact —
      #   can drift. This is the only place that drift gets caught, so it runs
      #   before terraform is even installed.
      #
      # Checks:
      #   1. v$(cat VERSION) == the pushed tag.
      #   2. CHANGELOG.md carries a "## [<version>]" heading.
      # -----------------------------------------------------------------------
      - name: Verify tag matches VERSION and CHANGELOG
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing at the repo root."
            exit 1
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}"

          echo "VERSION file : ${version}"
          echo "Pushed tag   : ${RELEASE_TAG}"

          if [ "${expected}" != "${RELEASE_TAG}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match VERSION (${expected}). Cut releases with 'make release-<level>'."
            exit 1
          fi

          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Step 3: Install Terraform on runner
      #
      # Pinned to 1.16.0, the floor set by `required_version` in every module
      # root and child module. Raise both together or CI stops matching a
      # local run.
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      # -----------------------------------------------------------------------
      # Step 4: Check formatting across the whole tree
      #
      # Same command the root Makefile's `fmt` target runs, in -check mode.
      # -----------------------------------------------------------------------
      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive terraform/

      # -----------------------------------------------------------------------
      # Step 5: Validate all twelve module roots
      #
      # `make validate` inits each root with -backend=false, so this needs no
      # Azure credentials and cannot touch remote state. It DOES download
      # providers, which is what makes it a real schema-level check rather
      # than a syntax check.
      # -----------------------------------------------------------------------
      - name: Terraform validate (all module roots)
        run: make validate

      # -----------------------------------------------------------------------
      # Step 6: Verify the SonarCloud token is present (no output)
      #
      # Opt-in, with the same `if:` as step 7 -- there is no point demanding a
      # token for a scan that is not going to run.
      #
      # Why:
      #   Without SONAR_TOKEN the scanner still downloads a JRE and the scanner
      #   binaries before dying on an opaque 401. Fail here instead, naming the
      #   cause. The likely cause -- the organization secret not being shared
      #   with this repository -- is not otherwise visible in the log.
      #
      # Security:
      #   Only the NAME of the missing variable is printed. Never the value.
      # -----------------------------------------------------------------------
      - name: Verify required secrets are present (no output)
        # A step-level `if:` is not a `run:` body, so the ${{ }} rule that
        # governs this repo does not apply: nothing is pasted into a shell.
        if: ${{ inputs.run_sonar }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for v in SONAR_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret/env var: ${v}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "SONAR_TOKEN is an organization Actions secret on"
            echo "rubensgomes-org. Confirm it is shared with this repository."
          fi
          exit $missing

      # -----------------------------------------------------------------------
      # Step 7: SonarCloud static analysis + quality gate
      #
      # Why:
      #   The tag is the last honest checkpoint before a release exists, so
      #   when this is asked for it runs ahead of steps 8 and 9: a red quality
      #   gate stops the GitHub Release from ever appearing. Nothing else here
      #   is conditional, so a failure stops the job outright.
      #
      # Opt-in:
      #   Runs only on a workflow_dispatch with run_sonar=true. A tag push
      #   supplies no inputs, so the release publishes without a scan. That is
      #   deliberate -- and it means a skipped scan is NOT a green gate.
      #
      # Notes:
      #   - Every scanner setting lives in sonar-project.properties at the repo
      #     root; nothing is passed here. `sonar.qualitygate.wait=true` in that
      #     file is what makes the scanner poll the gate and exit non-zero when
      #     it fails -- there is no separate quality-gate action. Change scope
      #     THERE, so this job and a local `make sonar` cannot drift.
      #   - SONAR_HOST_URL is deliberately unset. It exists for self-hosted
      #     SonarQube Server; this is SonarQube Cloud and sonar.host.url is
      #     already in the properties file.
      #   - The only guard on this step is `inputs.run_sonar`. Do NOT add
      #     `if: env.SONAR_TOKEN != ''` on top of it: that skips the gate
      #     exactly when the secret is misconfigured -- silently, and having
      #     been asked for the gate -- which is the opposite of what a gate is
      #     for. Step 6 is the guard for a missing token.
      #   - Step 1 checks out with fetch-depth: 0, which the scanner needs for
      #     new-code blame attribution. Do not reduce it.
      # -----------------------------------------------------------------------
      - name: SonarCloud scan (quality gate blocks the release)
        if: ${{ inputs.run_sonar }}
        uses: SonarSource/sonarqube-scan-action@v8
        # No `args:`. sonar.branch.name=main is pinned in
        # sonar-project.properties, which is load-bearing here: without it the
        # tag ref is submitted as a SHORT-lived branch and the gate lookup
        # 403s. See that file for the full post-mortem.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # -----------------------------------------------------------------------
      # Step 8: Extract this version's changelog section as the release notes
      #
      # awk prints everything between "## [<version>]" and the next "## ["
      # heading. Written to a file rather than an output variable so newlines
      # and markdown survive intact.
      # -----------------------------------------------------------------------
      - name: Build release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail

          awk -v ver="${version}" '
            $0 == "## [" ver "]" || index($0, "## [" ver "] ") == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::Extracted release notes for ${version} are empty."
            exit 1
          fi

          echo "----- release notes -----"
          cat release-notes.md

      # -----------------------------------------------------------------------
      # Step 9: Publish the GitHub Release
      #
      # Idempotent-ish: if the release already exists (a re-run), `gh release
      # create` fails, so we edit instead. Keeps re-runs from being a dead end.
      # -----------------------------------------------------------------------
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists - updating notes."
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
