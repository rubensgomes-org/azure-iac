# =============================================================================
# Terraform Bootstrap Backend - DESTROY (manual, guarded)
#
# Purpose:
#   Destroys ONLY the Terraform *bootstrap backend* resources defined under:
#       terraform/bootstrap-backend
#
# Why this exists:
#   Bootstrap backend resources are foundational (state RG, storage account,
#   blob container, etc.). This workflow provides an explicit, standalone way
#   to delete those foundational resources when you truly mean it.
#
# Trigger:
#   Manual only (workflow_dispatch). You start it from the GitHub Actions UI.
#
# SAFEGUARD (IMPORTANT):
#   This workflow now enforces an explicit “question + response” safeguard:
#   - The workflow_dispatch form asks the user to type a specific phrase.
#   - The job fails immediately if the phrase does not match exactly.
#
# Authentication:
#   Uses Azure Service Principal + Client Secret stored in GitHub Environment
#   Secrets (Environment name: "AZURE"):
#     - AZURE_CLIENT_ID
#     - AZURE_CLIENT_SECRET
#     - AZURE_TENANT_ID
#     - AZURE_SUBSCRIPTION_ID
#
# Notes:
#   - Terraform automatically loads terraform.tfvars from WORKING_DIR.
#   - azure/login@v2 does NOT accept "client-secret:" as an input; for SP+secret
#     auth you must use the "creds" JSON object.
#   - The Storage Account name is a real INPUT (default "sttfstaterubens01"),
#     mirroring tf-bootstrap-create.yml: Storage Account names are globally
#     unique across all of Azure, so a backend bootstrapped under a different
#     name has to be destroyable under that name too. It is NOT compared to a
#     hardcoded constant any more - see the SAFEGUARD step for what replaces
#     that check and why the guard is no weaker.
# =============================================================================

name: TF Bootstrap Destroy

# -----------------------------------------------------------------------------
# Manual trigger ONLY, with safeguard inputs.
#
# The workflow UI will show these fields when you click "Run workflow".
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >
          DO NOT EVER REMOVE THE BOOTSTRAP BACKEND RESOURCES UNLESS YOU FOLLOW A VERY
          RIGOROUS PROCEDURE BEFORE DOING SO.
          SAFEGUARD QUESTION: Type EXACTLY "DESTROY <rg_name> <storage_account_name>
          <container_name>", using the SAME storage account name you typed in the
          storage_account_name field. For the defaults that phrase is:
          DESTROY rg-tfstate sttfstaterubens01 tfstate
        required: true
        type: string

      rg_name:
        description: "Target RG name (must match the expected bootstrap RG)"
        required: true
        default: "rg-tfstate"
        type: string

      # ---------------------------------------------------------------------
      # storage_account_name
      #
      # Unlike rg_name and container_name - which are echoes checked against
      # hardcoded constants - this field NAMES THE TARGET. Storage Account
      # names are globally unique across every Azure tenant, so a backend
      # bootstrapped elsewhere (see the matching input on
      # tf-bootstrap-create.yml) carries a different name, and a constant here
      # would make that backend impossible to tear down through this workflow.
      #
      # What still guards it, now that there is no constant to compare against:
      #   - the ALLOWED_ACTOR gate and the AZURE Environment binding;
      #   - double entry - the value must be repeated verbatim inside `confirm`,
      #     so a single typo cannot reach Terraform;
      #   - a format check (3-24 lowercase alphanumeric) in the SAFEGUARD step;
      #   - rg_name stays pinned to the constant, so the blast radius is capped
      #     at a Storage Account inside the expected bootstrap RG. The imports
      #     in .github/actions/import-state address the account through that RG.
      # ---------------------------------------------------------------------
      storage_account_name:
        description: "Target Storage Account name (globally unique; 3-24 lowercase alphanumeric)"
        required: true
        default: "sttfstaterubens01"
        type: string

      container_name:
        description: "Target Container name (must match expected)"
        required: true
        default: "tfstate"
        type: string

# -----------------------------------------------------------------------------
# Permissions:
# contents:read is enough for checkout. Keep least privilege.
# -----------------------------------------------------------------------------
permissions:
  contents: read

# -----------------------------------------------------------------------------
# Concurrency:
# Prevent apply/destroy from running at the same time.
# -----------------------------------------------------------------------------
concurrency:
  group: terraform-bootstrap
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy bootstrap backend
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------------
    # Bind the GitHub Environment named "AZURE" to this job.
    # REQUIRED for Environment secrets to be injected.
    # -------------------------------------------------------------------------
    environment: AZURE

    env:
      # -----------------------------------------------------------------------
      # Terraform folder containing the bootstrap backend code + terraform.tfvars
      # -----------------------------------------------------------------------
      WORKING_DIR: terraform/bootstrap-backend

      # -----------------------------------------------------------------------
      # AzureRM provider authentication (Service Principal + Secret)
      # Terraform's AzureRM provider reads these automatically.
      # -----------------------------------------------------------------------
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Makes Terraform less interactive and more CI-friendly.
      TF_IN_AUTOMATION: "true"

      # -----------------------------------------------------------------------
      # Bootstrap identifiers used both for documentation and safeguard validation.
      # IMPORTANT: Keep these in sync with your terraform/bootstrap-backend config.
      #
      # Naming: an EXPECTED_ prefix marks a constant that an input is validated
      # against. STORAGE_ACCOUNT_NAME has none because it is not a constant -
      # it is the dispatch input naming the account this run targets.
      # -----------------------------------------------------------------------
      EXPECTED_RG_NAME: "rg-tfstate"
      # Supplied by the dispatch input above (defaults to "sttfstaterubens01"),
      # exactly as in tf-bootstrap-create.yml. Bound here once so the SAFEGUARD
      # step, the backend `init`, the `-var` on destroy, and
      # .github/actions/import-state all read one value from the environment.
      #
      # It carries no "EXPECTED_" prefix, unlike its two neighbours, and the
      # difference is meaningful rather than cosmetic: those two ARE constants
      # that the typed inputs are checked against, while this one IS the target
      # the run acts on. .github/actions/import-state reads all three from the
      # environment under exactly these names.
      STORAGE_ACCOUNT_NAME: ${{ github.event.inputs.storage_account_name }}
      EXPECTED_CONTAINER_NAME: "tfstate"

      # -----------------------------------------------------------------------
      # Optional hard lock: only allow a specific actor to run this workflow.
      # - This is extra defense-in-depth for public repos.
      # - If you ever rename your GitHub username, update this value.
      # -----------------------------------------------------------------------
      ALLOWED_ACTOR: "rubensgomes"

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository content
      #
      # Fetches the Terraform code in terraform/bootstrap-backend.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # Step 2: SAFEGUARD - Validate actor + typed confirmation + target fields
      #
      # Purpose:
      #   Ensures destructive operation is deliberate and aimed at the expected
      #   bootstrap resources.
      #
      # What it enforces:
      #   1) (Optional) Only ALLOWED_ACTOR may run this workflow
      #   2) rg_name / container_name must match the expected constants
      #   3) storage_account_name must be a well-formed Storage Account name
      #      (it names the target, so there is no constant to match it against)
      #   4) confirm input must EXACTLY match:
      #        "DESTROY <rg> <storage> <container>"
      #
      # Why (3) is not a mismatch check like (2):
      #   There is no constant left to compare against. $STORAGE_ACCOUNT_NAME
      #   IS the typed input, so a mismatch check would compare the value to
      #   itself - a tautology that always passes while reading like a guard.
      #   It is replaced by a format check plus the double entry in (4): the
      #   same name has to be typed a second time inside the confirmation
      #   phrase, which is the property the old constant provided.
      #
      # Failure behavior:
      #   If any check fails, the workflow exits immediately before logging in
      #   or calling Terraform.
      # -----------------------------------------------------------------------
      - name: SAFEGUARD - Validate confirmation (type-to-confirm)
        shell: bash
        env:
          # Every dispatch input and github.* value this step compares is bound
          # here rather than written into the script body below.
          #
          # A `${{ ... }}` expression inside a `run:` is pasted in as raw TEXT
          # before the shell parses the script, so a crafted input escapes the
          # quoting and executes on the runner -- here, inside the guard that
          # stands between a dispatch and the destruction of the Terraform state
          # backend, with the credentials already in scope. Through `env:` the
          # shell only ever sees ordinary variables.
          #
          # The comparisons are unchanged; only how the values arrive is. Do not
          # "simplify" these back into the script.
          ACTOR: ${{ github.actor }}
          TYPED_RG_NAME: ${{ github.event.inputs.rg_name }}
          TYPED_STORAGE_ACCOUNT_NAME: ${{ github.event.inputs.storage_account_name }}
          TYPED_CONTAINER_NAME: ${{ github.event.inputs.container_name }}
          TYPED_CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail

          # ---- (Optional) Actor allowlist gate ----
          # Comment this block out if you do NOT want actor restriction.
          if [ "${ACTOR}" != "${ALLOWED_ACTOR}" ]; then
            echo "Denied: Only '${ALLOWED_ACTOR}' may run this workflow."
            echo "Current actor: '${ACTOR}'"
            exit 1
          fi

          # ---- Validate target identifiers match expected ----
          if [ "${TYPED_RG_NAME}" != "${EXPECTED_RG_NAME}" ]; then
            echo "Denied: rg_name mismatch."
            echo "Expected: '${EXPECTED_RG_NAME}'"
            echo "Got:      '${TYPED_RG_NAME}'"
            exit 1
          fi

          # storage_account_name NAMES THE TARGET, so it is validated for shape
          # rather than compared to a constant. Same regex as the
          # `storage_account_id` validation in
          # terraform/bootstrap-backend/variables.tf and as the fail-fast step
          # in tf-bootstrap-create.yml. Keep the three in sync. Double entry is
          # enforced by the confirmation phrase below.
          if ! printf '%s' "${TYPED_STORAGE_ACCOUNT_NAME}" | grep -Eq '^[a-z0-9]{3,24}$'; then
            echo "Denied: storage_account_name is not a valid Storage Account name."
            echo "Must be 3-24 characters, lowercase letters and digits only."
            echo "Got:      '${TYPED_STORAGE_ACCOUNT_NAME}'"
            exit 1
          fi

          if [ "${TYPED_CONTAINER_NAME}" != "${EXPECTED_CONTAINER_NAME}" ]; then
            echo "Denied: container_name mismatch."
            echo "Expected: '${EXPECTED_CONTAINER_NAME}'"
            echo "Got:      '${TYPED_CONTAINER_NAME}'"
            exit 1
          fi

          # ---- Validate type-to-confirm phrase ----
          expected="DESTROY ${EXPECTED_RG_NAME} ${STORAGE_ACCOUNT_NAME} ${EXPECTED_CONTAINER_NAME}"
          if [ "${TYPED_CONFIRM}" != "${expected}" ]; then
            echo "Denied: Confirmation phrase did not match exactly."
            echo "Expected: ${expected}"
            echo "Got:      ${TYPED_CONFIRM}"
            exit 1
          fi

          echo "Safeguard passed. Proceeding with destroy."

      # -----------------------------------------------------------------------
      # Step 3: Verify required secrets are present (fail fast)
      #
      # Purpose:
      #   Ensures Environment secrets actually resolved into ARM_* variables.
      #   If any are missing, fail before attempting Azure login or Terraform.
      #
      # Security:
      #   Does not print secret values (only variable names).
      # -----------------------------------------------------------------------
      - name: Verify required secrets are present (no output)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret/env var: ${v}"
              missing=1
            fi
          done
          exit $missing

      # -----------------------------------------------------------------------
      # Step 4: Azure Login (Service Principal + Client Secret)
      #
      # Notes:
      #   - azure/login@v2 expects SP+secret auth via the "creds" JSON payload.
      #   - We explicitly set auth-type=SERVICE_PRINCIPAL.
      # -----------------------------------------------------------------------
      - name: Azure Login (Service Principal Secret)
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}

      # -----------------------------------------------------------------------
      # Step 5: Install Terraform CLI on the runner
      #
      # Notes:
      #   - Keep version pinned to match your validated version.
      #   - Must satisfy `required_version = "~> 1.15"`, declared in
      #     terraform/bootstrap-backend/versions.tf and in every other
      #     versions.tf in the repo. This pin was 1.14.3, which does NOT
      #     satisfy it — `terraform init` would have failed here.
      #   - Keep in step with .github/workflows/release.yml, which pins the
      #     same build.
      #   - terraform_wrapper=false keeps logs simpler/cleaner.
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # -----------------------------------------------------------------------
      # Step 6: terraform init
      #
      # Purpose:
      #   Initializes providers and state so Terraform can destroy correctly.
      #
      # `-backend-config="storage_account_name=..."` overrides the literal in
      # terraform/bootstrap-backend/backend.tf, which cannot interpolate a
      # variable. With the default input it supplies the value that file already
      # hardcodes, so nothing changes; with a custom one it points the backend at
      # the same account this run is about to destroy - which is also the account
      # holding the state being read. Mirrors tf-bootstrap-create.yml.
      # -----------------------------------------------------------------------
      - name: Terraform init (bootstrap)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init --upgrade \
            -backend-config="storage_account_name=${STORAGE_ACCOUNT_NAME}"

      # -----------------------------------------------------------------------
      # Step 7: terraform import bootstrap backend state (optional)
      #
      # Purpose:
      #   If resources were created previously outside this runner’s state,
      #   import-state can align state with reality before destruction.
      #
      # Note:
      #   This assumes you have a local composite action at:
      #     ./.github/actions/import-state
      # -----------------------------------------------------------------------
      - name: Terraform import backend state (bootstrap)
        uses: ./.github/actions/import-state

      # -----------------------------------------------------------------------
      # Step 8: terraform destroy
      #
      # WARNING:
      #   This permanently deletes the bootstrap backend resources.
      #
      # -auto-approve:
      #   Non-interactive destroy. The safeguard above is your human confirmation.
      # -----------------------------------------------------------------------
      - name: Terraform destroy (bootstrap)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform destroy -auto-approve \
            -var="storage_account_id=${STORAGE_ACCOUNT_NAME}"

      # -----------------------------------------------------------------------
      # Step 9: Capture and save Terraform error output for later view.
      # -----------------------------------------------------------------------
      - name: Upload errored.tfstate if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: errored-tfstate
          path: errored.tfstate
          if-no-files-found: ignore
