# =============================================================================
# Main Verify
#
# Purpose:
#   The continuous check on main. This repo is trunk-based -- every change is
#   committed straight to main, there are no feature branches and no pull
#   requests -- so this workflow is what tells you a commit broke something.
#   Before it existed, `fmt -check`, `make validate` and the Sonar gate only
#   ran at tag time inside release.yml, which is far too late to be useful.
#
# Trigger:
#   workflow_dispatch ONLY. You start it from the GitHub Actions UI.
#
#   The consequence is worth stating plainly: NOTHING verifies main
#   automatically. A commit that breaks `fmt -check`, `make validate` or the
#   Sonar gate sits unnoticed until someone runs this by hand or pushes a
#   release tag, at which point release.yml runs the same three checks as the
#   final gate. Run `make fmt` and `make validate` before committing -- that is
#   the real gate, not this workflow.
#
#   It cannot be a required status check: a dispatch-only workflow does not
#   report against a push at all.
#
#   The branch selector on the dispatch form accepts any ref, so step 0 of the
#   sonar job pins the run to main -- see that job for why.
#
#   The `run_sonar` input defaults to FALSE, so a bare dispatch runs the two
#   cheap local checks (terraform, workflows) and SKIPS the SonarCloud scan.
#   Tick the box, or pass `-f run_sonar=true`, when you want the gate. The
#   scan is the slow part of this workflow and the only part that needs a
#   secret or reaches a third party, so it is opt-in rather than a tax on
#   every "did I break fmt?" dispatch.
#
# Relationship to release.yml:
#   Same three checks, different moment. This one reports when asked;
#   release.yml re-runs them at tag time as the final gate before a GitHub
#   Release is published. Neither replaces the other -- a tag can be pushed for
#   a commit whose checks went green weeks earlier.
#
# Structure:
#   THREE JOBS, NOT ONE, on purpose. They run in parallel, and each reports as
#   a separately named check, so a failure names the area rather than sending
#   you into a single combined log. Two always run; `sonar` runs only when the
#   `run_sonar` input is true, and otherwise reports as skipped.
#
# Notes:
#   - terraform_version must satisfy the `required_version = ">= 1.16.0, < 2.0"`
#     declared in every versions.tf in the repo. Every Terraform-touching
#     workflow in this directory pins the same build; bump them together.
#   - terraform_wrapper is false, matching every other workflow that runs it.
# =============================================================================

name: Main Verify

on:
  # Manual trigger only -- see the Trigger note above.
  workflow_dispatch:
    inputs:
      # -----------------------------------------------------------------------
      # run_sonar
      #
      # Defaults to false so the common case -- "check my formatting and that
      # every root still validates" -- is a one-click dispatch that finishes in
      # a couple of minutes and touches nothing outside the runner.
      #
      # Setting it true adds the SonarCloud scan: a full-history checkout, a
      # network round trip, the org-level SONAR_TOKEN, and a PUBLISHED analysis
      # that overwrites main's quality gate status. Opt in when you want the
      # gate -- most usefully before pushing a release tag, since release.yml
      # runs the same scan after the tag already exists.
      #
      # `type: boolean` renders a checkbox and, unlike github.event.inputs.*,
      # arrives in the `inputs` context as a real boolean, so the job-level
      # `if:` below needs no string comparison.
      # -----------------------------------------------------------------------
      run_sonar:
        description: "Also run the SonarCloud scan (publishes main's quality gate)"
        required: false
        type: boolean
        default: false

# Workflow-level default: read-only, for every job. The one job that needs more
# raises it for itself -- see the `sonar` job's own `permissions:` block. Keep
# write scopes out of here: a workflow-level grant hands the token to jobs that
# have no use for it, including any job added later.
permissions:
  contents: read

concurrency:
  # Keyed on the ref, so a second dispatch supersedes one already in flight for
  # the same branch. Unlike the release and ACR workflows, cancelling here is
  # safe and desirable: these jobs touch no Azure state and hold no locks, and
  # only the newest result is interesting.
  group: main-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: terraform
  #
  # The two gates release.yml runs at tag time. No credentials: `make validate`
  # inits every root with -backend=false, so this cannot reach the subscription
  # or the state container.
  # ---------------------------------------------------------------------------
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository content
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # Step 2: Install Terraform on the runner
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      # -----------------------------------------------------------------------
      # Step 3: Check formatting across the whole tree
      #
      # Same command the root Makefile's `fmt` target runs, in -check mode.
      # -----------------------------------------------------------------------
      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive terraform/

      # -----------------------------------------------------------------------
      # Step 4: Validate all twelve module roots
      #
      # Downloads providers, so this is a real schema-level check rather than a
      # syntax check -- which is what makes it worth the ~1 minute it costs.
      # -----------------------------------------------------------------------
      - name: Terraform validate (all module roots)
        run: make validate

  # ---------------------------------------------------------------------------
  # Job 2: workflows
  #
  # Guards the workflow files themselves. This repo edits them constantly and a
  # broken one is only discovered when the workflow next fires -- which for the
  # release and destroy workflows is exactly the worst moment.
  # ---------------------------------------------------------------------------
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # Step 1: Every workflow file must parse as YAML
      # -----------------------------------------------------------------------
      - name: Workflows parse as YAML
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          for f in .github/workflows/*.yml .github/actions/*/action.yml; do
            [ -e "$f" ] || continue
            if ruby -ryaml -e 'YAML.load_file(ARGV[0])' "$f" 2>/dev/null; then
              echo "  ok   $f"
            else
              echo "::error file=$f::does not parse as YAML"
              rc=1
            fi
          done
          exit $rc

      # -----------------------------------------------------------------------
      # Step 2: No GitHub expression interpolated inside any `run:` body
      #
      # Why:
      #   GitHub substitutes such an expression as raw TEXT before the shell
      #   parses the script, so a value containing a quote or $(...) executes on
      #   the runner. In this repo the affected steps were the type-to-confirm
      #   guards in front of two destroys, with credentials already in scope.
      #   Bind through `env:` and reference "$VAR" instead.
      #
      #   This is Sonar rule githubactions:S7630, which the sonar job below also
      #   catches -- but that job needs a token and a network round trip, and
      #   this check is instant and works on a fork. Cheap enough to duplicate.
      #
      #   The convention is documented in CLAUDE.md.
      # -----------------------------------------------------------------------
      - name: No expression interpolation inside run blocks
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            bad = []
            Dir[".github/workflows/*.yml"].sort.each do |f|
              doc = YAML.load_file(f) || {}
              (doc["jobs"] || {}).each_value do |job|
                (job["steps"] || []).each do |step|
                  body = step["run"] or next
                  body.scan(/\$\{\{[^}]*\}\}/) do |m|
                    bad << [f, step["name"] || "<unnamed>", m]
                  end
                end
              end
            end
            bad.each do |f, name, m|
              puts "::error file=#{f}::#{m} appears inside the run body of step " \
                   "\x27#{name}\x27. Bind it to an env: key and reference \"$VAR\" instead."
            end
            if bad.empty?
              puts "clean: no run body interpolates a GitHub expression"
            else
              puts "#{bad.size} interpolation(s) found. See CLAUDE.md."
              exit 1
            end
          '

  # ---------------------------------------------------------------------------
  # Job 3: sonar
  #
  # SonarCloud analysis of main. sonar.branch.name=main is pinned in
  # sonar-project.properties -- main is the only branch this repo has -- so no
  # scanner argument is passed here and CI cannot drift from `make sonar`.
  # ---------------------------------------------------------------------------
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Opt-in. A false (default) value skips the whole job -- it reports as
    # "skipped" in the Actions UI, not as a pass, so a skipped scan is never
    # mistaken for a green gate.
    #
    # A job-level `if:` is not a `run:` body, so the ${{ }} rule that governs
    # the rest of this repo does not apply: nothing is pasted into a shell.
    if: ${{ inputs.run_sonar }}

    # Scoped to THIS job so it is explicit, even though it matches the
    # workflow default. A job-level block REPLACES that default rather than
    # adding to it, so `contents: read` has to be stated here or the checkout
    # loses it. No `pull-requests: write`: there is no PR diff to decorate.
    permissions:
      contents: read

    env:
      # Bound here rather than written into the run body below. A `${{ ... }}`
      # inside a `run:` is substituted as raw TEXT before the shell parses it.
      SOURCE_REF: ${{ github.ref }}

    steps:
      # -----------------------------------------------------------------------
      # Step 0: SAFEGUARD - this job may only analyse main
      #
      # The workflow_dispatch form offers a BRANCH SELECTOR and will happily
      # run this against any ref in the repo. A push-triggered workflow scoped
      # to main would have the ref by construction; this one does not.
      #
      # That matters specifically for Sonar. sonar-project.properties pins
      # `sonar.branch.name=main` and every caller passes the scanner no
      # arguments, so a run started from another branch would publish THAT
      # branch's code as main's analysis -- overwriting the quality gate status
      # for a commit that was never on main. `make sonar` refuses to run off
      # main for exactly this reason; this is the CI counterpart of that guard.
      #
      # Only the sonar job is guarded. The `terraform` and `workflows` jobs are
      # pure local checks with no published side effect, so running them from a
      # branch is harmless and occasionally useful.
      # -----------------------------------------------------------------------
      - name: SAFEGUARD - Validate source ref is main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SOURCE_REF}" != "refs/heads/main" ]; then
            echo "Denied: the sonar job analyses 'main' only."
            echo "sonar-project.properties pins sonar.branch.name=main, so a run"
            echo "from another ref would publish its code as main's analysis."
            echo "Ref: '${SOURCE_REF}'"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Step 1: Checkout, with full history
      #
      # fetch-depth: 0 is required -- the scanner attributes findings to new
      # code from git blame, and a shallow clone silently degrades that.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Step 2: Fail fast if SONAR_TOKEN is missing
      #
      # Same shape as release.yml. Only the NAME is printed, never the value.
      # -----------------------------------------------------------------------
      - name: Verify required secrets are present (no output)
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for v in SONAR_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret/env var: ${v}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "SONAR_TOKEN is an organization Actions secret on"
            echo "rubensgomes-org. Confirm it is shared with this repository."
          fi
          exit $missing

      # -----------------------------------------------------------------------
      # Step 3: Scan
      #
      # sonar.qualitygate.wait=true in sonar-project.properties makes this
      # blocking, so a commit that fails the gate fails this check.
      # -----------------------------------------------------------------------
      - name: SonarCloud scan (main)
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
