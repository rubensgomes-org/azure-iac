# =============================================================================
# RG Destroy (reusable)
#
# Destroys ONE module 01 resource group, selected by lifecycle purpose, for
# one environment. azurerm refuses to delete a resource group that still
# holds resources, so this succeeds only after the modules deployed into it
# are destroyed. The Terraform state backend is never in scope.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================

name: RG Destroy (reusable)

on:
  workflow_call:
    inputs:
      environment_name:
        description: >
          Estate environment whose resource group is destroyed. Maps to the
          Makefile ENV variable and selects terraform/envs/<env>.
        type: string
        required: true

      purpose:
        description: >
          Lifecycle purpose of the resource group to destroy: platform,
          network, data, app, observability or ai.
        type: string
        required: true

      dry_run:
        description: >
          true (default) plans the destroy only. false deletes the resource
          group.
        type: boolean
        required: false
        default: true

      confirm:
        description: >
          SAFEGUARD: ignored on a dry run. Otherwise must be exactly "Yes".
        type: string
        required: false
        default: "No"

    secrets:
      AZURE_CLIENT_SECRET:
        required: false

  workflow_dispatch:
    inputs:
      environment_name:
        description: >
          Estate environment whose resource group is destroyed. Maps to the
          Makefile ENV variable and selects terraform/envs/<env>.
        type: choice
        required: true
        options:
          - dev
          - lab

      purpose:
        description: Lifecycle purpose of the resource group to destroy.
        type: choice
        required: true
        options:
          - platform
          - network
          - data
          - app
          - observability
          - ai

      dry_run:
        description: >
          Leave CHECKED to plan the destroy and stop without touching Azure.
          Clear it to actually delete the resource group.
        type: boolean
        required: false
        default: true

      confirm:
        description: >
          DESTROYS THE SELECTED RESOURCE GROUP. Ignored on a dry run.
          Otherwise must be "Yes" to proceed.
        type: choice
        required: true
        default: "No"
        options:
          - "No"
          - "Yes"

permissions:
  contents: read

jobs:
  rg-destroy:
    name: rg-destroy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Also the hook for a required-reviewer approval gate. On workflow_call
    # it resolves in the CALLER's repository, which must define its own
    # "AZURE" Environment.
    environment: AZURE

    # Shared verbatim with the other rg-* workflows; on workflow_call it is
    # scoped to the CALLER's repository. cancel-in-progress stays false:
    # cancelling mid-destroy leaves an azurerm blob lease behind.
    concurrency:
      group: rg-lifecycle-${{ inputs.environment_name }}
      cancel-in-progress: false

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `|| 'rgomes'` is load-bearing: on a teardown, a wrong workload names
      # RGs that do not exist, so the destroy is a no-op reported as success.
      TF_VAR_workload: ${{ vars.TF_VAR_workload || 'rgomes' }}

      TF_VAR_env: ${{ inputs.environment_name }}
      TF_VAR_location: ${{ vars.TF_VAR_location }}
      TF_VAR_owner: ${{ vars.TF_VAR_owner }}

      # No `|| default`: an empty value points Terraform at a nonexistent
      # state, where the destroy plans a clean no-op and reports success.
      TF_VAR_backend_resource_group_name: >-
        ${{ vars.TF_VAR_backend_resource_group_name }}
      TF_VAR_storage_account_id: ${{ vars.TF_VAR_storage_account_id }}
      TF_VAR_container_name: ${{ vars.TF_VAR_container_name }}

      TF_IN_AUTOMATION: "true"

      # Bound here, not interpolated into run: bodies (Sonar
      # githubactions:S7630, enforced by main-verify.yml).
      ROOTS_DIR: terraform/roots
      ENV_NAME: ${{ inputs.environment_name }}
      PURPOSE: ${{ inputs.purpose }}
      RG_NAME: >-
        ${{ format('rg-{0}{1}-{2}', vars.TF_VAR_workload || 'rgomes',
        inputs.purpose, inputs.environment_name) }}

      # The only two GitHub accounts permitted to run a destructive workflow
      # in this repo. Update on a rename.
      ALLOWED_ACTORS: "rubensgomes rubens-gomes_3CC"

    steps:
      # On workflow_call from another repository, the checkout defaults
      # (github.repository/github.sha) resolve to the CALLER, which has no
      # Makefile. job.workflow_repository/job.workflow_sha name this
      # workflow's own repo and commit on every trigger.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      # Runs before any credential is touched. confirm is enforced
      # only when dry_run is false; the actor allowlist applies to both.
      - name: SAFEGUARD - Validate actor and confirmation
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          CONFIRM: ${{ inputs.confirm }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          allowed=false
          for allowed_actor in ${ALLOWED_ACTORS}; do
            if [ "${ACTOR}" = "${allowed_actor}" ]; then
              allowed=true
              break
            fi
          done
          if [ "${allowed}" != "true" ]; then
            echo "Denied: this is a personal workflow currently being used"
            echo "by 'Rubens Gomes' only. Actor: '${ACTOR}'."
            exit 1
          fi

          if ! printf '%s' "${ENV_NAME}" | grep -qE '^[a-z][a-z0-9]{1,9}$'; then
            echo "Denied: environment_name must be 2-10 lowercase alphanumeric"
            echo "characters starting with a letter."
            exit 1
          fi

          if ! printf '%s' "${PURPOSE}" \
              | grep -qxE 'platform|network|data|app|observability|ai'; then
            echo "Denied: purpose must be one of platform, network, data, app,"
            echo "observability or ai. Got: '${PURPOSE}'."
            exit 1
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run. The confirm input is ignored."
            echo "Nothing in Azure will be modified."
            exit 0
          fi

          if [ "${CONFIRM}" != "Yes" ]; then
            echo "Denied: confirm must be 'Yes' to proceed."
            echo "Got: '${CONFIRM}'"
            exit 1
          fi

          echo "Safeguard passed. Target: module 01 '${PURPOSE}' resource"
          echo "group for env ${ENV_NAME}. The state backend is NOT destroyed."

      - name: Verify required Azure configuration is present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID \
                   ARM_SUBSCRIPTION_ID TF_VAR_env TF_VAR_location \
                   TF_VAR_backend_resource_group_name \
                   TF_VAR_storage_account_id TF_VAR_container_name; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret/env var: ${v}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Check the calling repository's Actions configuration:"
            echo "  Variables: AZURE_CLIENT_ID, AZURE_TENANT_ID,"
            echo "             AZURE_SUBSCRIPTION_ID, TF_VAR_location,"
            echo "             TF_VAR_backend_resource_group_name,"
            echo "             TF_VAR_storage_account_id, TF_VAR_container_name"
            echo "  Secret:    AZURE_CLIENT_SECRET"
          fi
          exit $missing

      - name: GUARD - Validate Terraform inputs and naming variables
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "${TF_VAR_location}" \
              | grep -qE '^[a-z][a-z0-9]*$'; then
            echo "FAIL: TF_VAR_location must be a lowercase Azure region"
            echo "token such as centralus."
            exit 1
          fi
          if ! printf '%s' "${TF_VAR_workload}" \
              | grep -qE '^[a-z][a-z0-9]{1,15}$'; then
            echo "FAIL: TF_VAR_workload must be 2-16 lowercase alphanumeric"
            echo "characters starting with a letter."
            exit 1
          fi
          if [ "${TF_VAR_backend_resource_group_name: -1}" = "." ] \
             || [ "${#TF_VAR_backend_resource_group_name}" -gt 90 ]; then
            echo "FAIL: TF_VAR_backend_resource_group_name cannot end with a"
            echo "period or exceed 90 characters."
            exit 1
          fi
          if ! printf '%s' "${TF_VAR_storage_account_id}" \
              | grep -qE '^[a-z0-9]{3,24}$'; then
            echo "FAIL: TF_VAR_storage_account_id must be 3-24 lowercase"
            echo "alphanumeric characters (an Azure storage account name)."
            exit 1
          fi
          if ! printf '%s' "${TF_VAR_container_name}" \
              | grep -qE '^[a-z0-9][a-z0-9-]{2,62}$'; then
            echo "FAIL: TF_VAR_container_name must be 3-63 lowercase"
            echo "alphanumeric/hyphen characters starting with alphanumeric."
            exit 1
          fi
          echo "RG name: ${RG_NAME}"

      # Terraform reads ARM_* itself; az is for the inventory and verify steps.
      - name: Azure Login (Service Principal Secret)
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: >-
            {"clientId":"${{ vars.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "tenantId":"${{ vars.AZURE_TENANT_ID }}",
             "subscriptionId":"${{ vars.AZURE_SUBSCRIPTION_ID }}"}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      # Informational only. Any resource listed here blocks the destroy.
      - name: Inventory the resource group (pre-destroy record)
        shell: bash
        run: |
          set -uo pipefail

          if ! az group show -n "${RG_NAME}" -o none 2>/dev/null; then
            echo "Resource group '${RG_NAME}' does not exist."
            exit 0
          fi

          echo "Resource group in scope (any contents block the destroy):"
          echo "  ${RG_NAME}"
          az resource list -g "${RG_NAME}" \
            --query "[].{Name:name, Type:type}" -o tsv 2>/dev/null \
            | sed 's/^/    /' || true

      - name: Plan the destroy of the resource group
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          make ENV="$ENV_NAME" PURPOSE="$PURPOSE" plan-destroy-resource-group

      - name: Dry run complete - nothing was destroyed
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          echo "Dry run complete. Azure was not modified."
          echo "To delete the resource group, dispatch again with:"
          echo "  dry_run:  unchecked"
          echo "  confirm:  Yes"

      - name: Destroy the resource group
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: make ENV="$ENV_NAME" PURPOSE="$PURPOSE" destroy-resource-group

      # Accumulates into rc and exits once, so every assertion is reported.
      - name: Verify the resource group is gone and the backend survived
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          rc=0

          if az group show -n "${RG_NAME}" -o none 2>/dev/null; then
            echo "FAIL: '${RG_NAME}' still exists after the destroy."
            rc=1
          else
            echo "OK: '${RG_NAME}' is gone."
          fi

          if az group show -n "${TF_VAR_backend_resource_group_name}" \
              -o none 2>/dev/null; then
            echo "OK: state backend resource group"
            echo "'${TF_VAR_backend_resource_group_name}' preserved."
          else
            echo "FAIL: '${TF_VAR_backend_resource_group_name}' is missing"
            echo "— the Terraform state backend is gone."
            rc=1
          fi

          exit $rc
