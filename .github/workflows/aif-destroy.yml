# =============================================================================
# AIF Destroy (reusable)
#
# Destroys modules 15 and 08: the Azure AI Foundry resource in the given
# region, with every model deployment on it, its Application Insights, and
# the storage account with every blob in it. Refuses while a project from
# aif-project-create.yml remains in that region. The storage
# account is kept while another region's Foundry state holds resources. The
# ai RG (module 01) and the workspace (module 03) stay in place, so
# aif-create.yml can bring them back.
# =============================================================================

name: AIF Destroy (reusable)

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Estate environment holding the Foundry resource"
        type: choice
        required: true
        options:
          - dev
          - lab

      location:
        description: "Region for Foundry. Empty uses TF_VAR_FOUNDRY_LOCATION."
        type: string
        required: false
        default: ""

      confirm:
        description: >
          DESTROYS MODULES 15 AND 08 — the Foundry resource, with every
          model deployment on it, and the storage account with
          every blob in it.
        type: choice
        required: true
        default: "No"
        options:
          - "No"
          - "Yes"

  workflow_call:
    inputs:
      environment_name:
        description: "Estate environment holding the Foundry resource."
        type: string
        required: true

      location:
        description: >-
          Azure region of the Foundry resource. Empty uses
          vars.TF_VAR_foundry_location, then vars.TF_VAR_location.
        type: string
        required: false
        default: ""

      confirm:
        description: >-
          SAFEGUARD: must be exactly "Yes". Destroys modules 15 and 08.
        type: string
        required: true

    secrets:
      AZURE_CLIENT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  destroy:
    name: destroy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    environment: AZURE

    # Must share this group string verbatim with aif-create.yml.
    concurrency:
      group: aif-lifecycle-${{ inputs.environment_name }}
      cancel-in-progress: false

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_workload: ${{ vars.TF_VAR_workload || 'rgomes' }}

      TF_VAR_env: ${{ inputs.environment_name }}
      TF_VAR_location: ${{ vars.TF_VAR_location }}
      # Same fallback as aif-create.yml; the region is part of the name.
      TF_VAR_foundry_location: ${{
        inputs.location || vars.TF_VAR_foundry_location }}
      TF_VAR_owner: ${{ vars.TF_VAR_owner }}

      TF_VAR_backend_resource_group_name: ${{ vars.TF_VAR_backend_resource_group_name }}
      TF_VAR_storage_account_id: ${{ vars.TF_VAR_storage_account_id }}
      TF_VAR_container_name: ${{ vars.TF_VAR_container_name }}

      TF_IN_AUTOMATION: "true"

      ROOTS_DIR: terraform/roots

      ENV_NAME: ${{ inputs.environment_name }}

      ALLOWED_ACTORS: "rubensgomes rubens-gomes_3CC"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: SAFEGUARD - Validate actor, confirmation and inputs
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          TYPED_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          allowed=false
          for allowed_actor in ${ALLOWED_ACTORS}; do
            if [ "${ACTOR}" = "${allowed_actor}" ]; then
              allowed=true
              break
            fi
          done
          if [ "${allowed}" != "true" ]; then
            echo "Denied: actor '${ACTOR}' is not allowed."
            exit 1
          fi

          if [ "$(printf '%s' "${TYPED_CONFIRM}" | tr -d '[:space:]')" \
              != "Yes" ]; then
            echo "Denied: confirm must be exactly 'Yes' to proceed."
            exit 1
          fi

          if ! printf '%s' "${ENV_NAME}" | grep -qE '^[a-z][a-z0-9]{1,9}$'; then
            echo "Denied: environment_name must be 2-10 lowercase"
            echo "alphanumeric characters starting with a letter."
            exit 1
          fi
          if ! printf '%s' "${TF_VAR_workload}" \
              | grep -qE '^[a-z][a-z0-9]{1,15}$'; then
            echo "Denied: TF_VAR_workload must be 2-16 lowercase"
            echo "alphanumeric characters starting with a letter."
            exit 1
          fi
          if [ -n "${TF_VAR_foundry_location}" ] \
              && ! printf '%s' "${TF_VAR_foundry_location}" \
                | grep -qE '^[a-z][a-z0-9]{1,30}$'; then
            echo "Denied: location must be an Azure region name such as"
            echo "'eastus2' (lowercase alphanumeric)."
            exit 1
          fi

          missing=0
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID \
                   ARM_SUBSCRIPTION_ID TF_VAR_location \
                   TF_VAR_backend_resource_group_name \
                   TF_VAR_storage_account_id TF_VAR_container_name; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret/env var: ${v}"
              missing=1
            fi
          done
          exit $missing

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      # az reads the module 16 and other regions' module 15 states.
      - name: Azure Login (Service Principal Secret)
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: >-
            {"clientId":"${{ vars.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "tenantId":"${{ vars.AZURE_TENANT_ID }}",
             "subscriptionId":"${{ vars.AZURE_SUBSCRIPTION_ID }}"}

      # Azure would delete the projects with the resource, orphaning their
      # module 16 states.
      - name: GUARD - Refuse while a Foundry project remains in the region
        shell: bash
        run: |
          set -euo pipefail
          region="${TF_VAR_foundry_location:-${TF_VAR_location}}"
          state_file="${RUNNER_TEMP}/foundry-project.tfstate"
          remaining=""
          blobs="$(az storage blob list --auth-mode key \
            --account-name "${TF_VAR_storage_account_id}" \
            --container-name "${TF_VAR_container_name}" \
            --prefix "foundry-project/${region}/" --query '[].name' -o tsv)"
          for blob in ${blobs}; do
            az storage blob download --auth-mode key --only-show-errors \
              --account-name "${TF_VAR_storage_account_id}" \
              --container-name "${TF_VAR_container_name}" \
              --name "${blob}" --file "${state_file}" >/dev/null
            managed="$(jq '[.resources[]? | select(.mode == "managed")]
              | length' "${state_file}")"
            if [ "${managed}" -gt 0 ]; then
              remaining="${remaining}  ${blob}"$'\n'
            fi
          done
          rm -f "${state_file}"
          if [ -n "${remaining}" ]; then
            echo "DENIED: run aif-project-destroy.yml first for:"
            printf '%s' "${remaining}"
            exit 1
          fi
          echo "OK: no Foundry project remains in ${region}."

      - name: Plan the destroy - module 15 (foundry-resource)
        shell: bash
        run: |
          make ENV="$ENV_NAME" plan-destroy-foundry-resource

      # Aborts if the plan would delete any type module 15 does not own.
      - name: GUARD - Assert the plan destroys only module 15 resources
        shell: bash
        working-directory: ${{ env.ROOTS_DIR }}/15-foundry-resource
        run: |
          set -euo pipefail
          # `make plan-destroy-<name>` writes no tfplan when the state is empty.
          if [ ! -f tfplan ]; then
            echo "OK: state is empty — already destroyed."
            exit 0
          fi
          forbidden="$(terraform show -json tfplan | jq -r '
            .resource_changes[]?
            | select(.change.actions | index("delete"))
            | select(.type | IN("azurerm_application_insights",
                                "azurerm_cognitive_account",
                                "azurerm_cognitive_account_connection_api_key",
                                "azurerm_role_assignment") | not)
            | .address')"
          if [ -n "${forbidden}" ]; then
            echo "DENIED: destroy plan reaches beyond module 15:"
            while IFS= read -r address; do
              echo "  ${address}"
            done <<< "${forbidden}"
            exit 1
          fi
          echo "OK: plan touches only module 15 resources."

      - name: Destroy module 15 - foundry resource
        shell: bash
        run: |
          make ENV="$ENV_NAME" destroy-foundry-resource

      # Module 08 storage is shared by every Foundry region in the env.
      - name: Check whether another Foundry region still holds resources
        id: other_regions
        shell: bash
        run: |
          set -euo pipefail
          region="${TF_VAR_foundry_location:-${TF_VAR_location}}"
          own_blob="foundry-resource/${region}/terraform.tfstate"
          state_file="${RUNNER_TEMP}/foundry.tfstate"
          in_use=false
          blobs="$(az storage blob list --auth-mode key \
            --account-name "${TF_VAR_storage_account_id}" \
            --container-name "${TF_VAR_container_name}" \
            --prefix foundry-resource/ --query '[].name' -o tsv)"
          for blob in ${blobs}; do
            [ "${blob}" != "${own_blob}" ] || continue
            az storage blob download --auth-mode key --only-show-errors \
              --account-name "${TF_VAR_storage_account_id}" \
              --container-name "${TF_VAR_container_name}" \
              --name "${blob}" --file "${state_file}" >/dev/null
            managed="$(jq '[.resources[]? | select(.mode == "managed")]
              | length' "${state_file}")"
            if [ "${managed}" -gt 0 ]; then
              echo "Keeping storage: ${blob} holds ${managed} resource(s)."
              in_use=true
            fi
          done
          rm -f "${state_file}"
          echo "in_use=${in_use}" >> "$GITHUB_OUTPUT"

      - name: Plan the destroy - module 08 (storage)
        if: steps.other_regions.outputs.in_use == 'false'
        shell: bash
        run: |
          make ENV="$ENV_NAME" plan-destroy-storage

      # Aborts if the plan would delete any type module 08 does not own.
      - name: GUARD - Assert the plan destroys only module 08 resources
        if: steps.other_regions.outputs.in_use == 'false'
        shell: bash
        working-directory: ${{ env.ROOTS_DIR }}/08-storage
        run: |
          set -euo pipefail
          # `make plan-destroy-<name>` writes no tfplan when the state is empty.
          if [ ! -f tfplan ]; then
            echo "OK: state is empty — already destroyed."
            exit 0
          fi
          forbidden="$(terraform show -json tfplan | jq -r '
            .resource_changes[]?
            | select(.change.actions | index("delete"))
            | select(.type | IN("azapi_resource",
                                "azurerm_role_assignment",
                                "azurerm_storage_account",
                                "time_sleep") | not)
            | .address')"
          if [ -n "${forbidden}" ]; then
            echo "DENIED: destroy plan reaches beyond module 08:"
            while IFS= read -r address; do
              echo "  ${address}"
            done <<< "${forbidden}"
            exit 1
          fi
          echo "OK: plan touches only module 08 resources."

      - name: Destroy module 08 - storage
        if: steps.other_regions.outputs.in_use == 'false'
        shell: bash
        run: |
          make ENV="$ENV_NAME" destroy-storage
