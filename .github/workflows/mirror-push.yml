# =============================================================================
# Mirror Push (work repo)
#
# Purpose:
#   Publishes this repository's `main` into a private repository in a work
#   GitHub Enterprise Managed Users (EMU) namespace:
#
#       source  rubensgomes-org/azure-iac        (this repo, public)
#       target  rubens-gomes_3CC/azure-iac       (work, private)
#
#   The push is a FORCE push of `main` and nothing else. No tags, no other
#   branches, no `--mirror`. The work copy is a read-only reflection of this
#   repo's trunk; it is not a place to develop.
#
# Trigger:
#   workflow_dispatch ONLY. Deliberately not `push: branches: [main]`, even
#   though that is the obvious shape for a mirror and is what most examples
#   show.
#
#   Mirroring is an outward-facing publish into a corporate namespace, and the
#   whole point of this workflow is that WHEN that happens stays a deliberate
#   decision rather than a side effect of committing. Every commit to `main`
#   here is already visible publicly; not every one of them is a moment to
#   overwrite the work repo's trunk. Do not "improve" this into an automatic
#   trigger.
#
# Authentication:
#   A single repository-level Actions secret, WORK_GITHUB_PAT, holding a
#   Personal Access Token for the work namespace. This workflow touches NO
#   Azure — no ARM_* variables, no `azure/login`, no Service Principal, no
#   GitHub Environment binding — and must stay that way, like main-verify.yml
#   and release.yml. It runs no Terraform either, so it does not participate in
#   the "bump terraform_version in every workflow together" rule.
#
#   The token requirements are EMU-specific and are the most likely thing to
#   break; README.md -> "Mirroring to the work repository" spells them out. The
#   short version: the PAT must be minted by the `rubens-gomes_3CC` identity
#   (not the personal account), and it needs BOTH `Contents: Read and write`
#   AND `Workflows: Read and write`. The second is easy to miss and is not
#   optional — the commits being mirrored modify files under
#   .github/workflows/, and a token without it is rejected with "refusing to
#   allow a Personal Access Token to create or update workflow ...".
#
# Relationship to the work repo:
#   One-directional and lossy by design. Anything committed directly to the
#   work repo's `main` is destroyed by the next run of this workflow. Step 4
#   logs the SHA being overwritten because the run log is the only record that
#   it ever existed.
#
#   The work repo also RECEIVES this directory, so main-verify.yml fires there
#   on every mirror push and fails (no SONAR_TOKEN, different org). Disable
#   Actions in the work repo — Settings -> Actions -> General -> Disable
#   actions. release.yml never fires there: no tags are pushed. This file's own
#   mirrored copy is dispatch-only and gated on an actor name that cannot exist
#   in an EMU namespace, so pressing Run there denies at step 2.
#
# Notes:
#   - The guard is the ALLOWED_ACTOR gate plus a check that the dispatch ran
#     from `main`. There is no type-to-confirm phrase: the blast radius is one
#     branch in one mirror, all of whose content is reproducible from here.
#   - NEVER write a `${{ ... }}` expression inside a `run:` body. It is
#     substituted as raw TEXT before the shell parses the script. Bind it to an
#     `env:` key and reference "$VAR". main-verify.yml's `workflows` job fails
#     the build on any violation, and Sonar rule githubactions:S7630 flags it
#     again. Every expression in this file is in an `env:`, `with:` or
#     `concurrency:` position for that reason.
#   - NEVER add `set -x` to the push step. GitHub masks a registered secret in
#     log output, so the credentialed URL renders as ***, but tracing that step
#     is asking for the one formatting accident that defeats the masking.
# =============================================================================

name: Mirror Push (work repo)

on:
  workflow_dispatch: {}  # manual trigger only -- see the Trigger note above

# Reads this repository. The PAT does all the writing, and it writes somewhere
# GITHUB_TOKEN cannot reach, so no write scope is needed or wanted here.
permissions:
  contents: read

concurrency:
  # Two concurrent force-pushes to the same branch can land in either order,
  # leaving the mirror on the older commit with a green run to say otherwise.
  # Queue instead of cancelling: a cancelled run mid-push is the one state
  # worse than waiting.
  group: mirror-push
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror
    runs-on: ubuntu-latest

    # A clone and a push. If this is still running after ten minutes, something
    # is hanging on the network rather than working.
    timeout-minutes: 10

    env:
      # Only this GitHub user may publish into the work namespace. Same gate,
      # and same value, as tf-bootstrap-destroy.yml and acr-destroy.yml.
      # Update on a rename.
      ALLOWED_ACTOR: "rubensgomes"

      # Every `${{ ... }}` this job needs is bound HERE, once, so that no run
      # body ever contains one. Interpolating into an `env:` VALUE is safe --
      # the shell only ever sees an ordinary variable. Interpolating into a
      # `run:` body is not. See the Notes in the header.
      ACTOR: ${{ github.actor }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_SHA: ${{ github.sha }}

      # The mirror target, spelled out rather than assembled from github.* so
      # that reading this block tells you exactly where a run pushes.
      MIRROR_HOST: github.com
      MIRROR_OWNER: rubens-gomes_3CC
      MIRROR_REPO: azure-iac
      MIRROR_BRANCH: main

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository content
      #
      # fetch-depth: 0 is load-bearing, not caution. The default shallow clone
      # cannot be pushed to a repository that does not already share its
      # history -- git rejects it, and on a first mirror there is no shared
      # history at all.
      #
      # persist-credentials: false matters specifically here: this job adds a
      # SECOND push destination, and there is no reason for the origin token to
      # sit in .git/config while that happens.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # -----------------------------------------------------------------------
      # Step 2: SAFEGUARD - actor allowlist + source ref must be main
      #
      # Runs BEFORE the secret is referenced, so a denied run never touches the
      # token at all.
      #
      # The ref check is not redundant with the branch selector: workflow_dispatch
      # lets the operator run this from ANY branch in the Actions form, and this
      # workflow force-pushes whatever it checked out over the work repo's
      # `main`. Only `main` mirrors `main`.
      # -----------------------------------------------------------------------
      - name: SAFEGUARD - Validate actor and source ref
        shell: bash
        run: |
          set -euo pipefail

          if [ "${ACTOR}" != "${ALLOWED_ACTOR}" ]; then
            echo "Denied: only '${ALLOWED_ACTOR}' may mirror to the work repository."
            echo "Actor: '${ACTOR}'"
            exit 1
          fi

          expected_ref="refs/heads/${MIRROR_BRANCH}"
          if [ "${SOURCE_REF}" != "${expected_ref}" ]; then
            echo "Denied: this workflow mirrors '${MIRROR_BRANCH}' only."
            echo "Expected ref: ${expected_ref}"
            echo "Got:          ${SOURCE_REF}"
            echo ""
            echo "Re-run from the ${MIRROR_BRANCH} branch using the Actions form's"
            echo "branch selector."
            exit 1
          fi

          echo "Safeguard passed."
          echo "Target: https://${MIRROR_HOST}/${MIRROR_OWNER}/${MIRROR_REPO} (${MIRROR_BRANCH})"

      # -----------------------------------------------------------------------
      # Step 3: Verify the required secret is present (fail fast)
      #
      # A missing or misnamed secret resolves to an EMPTY STRING, which turns
      # the push URL into an anonymous one and produces a 403 that reads like a
      # permissions problem rather than a configuration one. Fail here, naming
      # the cause.
      #
      # This is also what makes the MIRRORED copy of this file harmless: the
      # work repo has no such secret, so a run there stops at this step -- if
      # it even reaches it past the actor gate.
      #
      # Only the variable NAME is ever printed.
      # -----------------------------------------------------------------------
      - name: Verify required secret is present (no output)
        shell: bash
        env:
          WORK_GITHUB_PAT: ${{ secrets.WORK_GITHUB_PAT }}
        run: |
          set -euo pipefail
          missing=0
          for v in WORK_GITHUB_PAT; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret: ${v}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "See README.md -> Mirroring to the work repository for what the"
            echo "token must be able to do (EMU identity; Contents AND Workflows"
            echo "read/write)."
          fi
          exit $missing

      # -----------------------------------------------------------------------
      # Step 4: Record what is about to be overwritten
      #
      # The push in step 5 is a FORCE push. Whatever the work repo's main
      # points at right now stops being reachable from any branch, and this log
      # line is the only record that it existed -- enough to recover it with
      # `git fetch <sha>` from the work repo's reflog window if it mattered.
      #
      # Wholly informational: `set -uo pipefail` without -e, and ls-remote is
      # allowed to fail. A brand-new empty work repo has no main yet, and that
      # is a normal first run, not an error.
      # -----------------------------------------------------------------------
      - name: Report what this run will overwrite
        shell: bash
        env:
          WORK_GITHUB_PAT: ${{ secrets.WORK_GITHUB_PAT }}
        run: |
          set -uo pipefail

          mirror_url="https://x-access-token:${WORK_GITHUB_PAT}@${MIRROR_HOST}/${MIRROR_OWNER}/${MIRROR_REPO}.git"

          before="$(git ls-remote "${mirror_url}" "refs/heads/${MIRROR_BRANCH}" 2>/dev/null | cut -f1)"
          local_line="$(git log -1 --oneline --no-decorate)"

          {
            echo "### Mirror push"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Target | \`${MIRROR_OWNER}/${MIRROR_REPO}\` (\`${MIRROR_BRANCH}\`) |"
            echo "| Pushing | \`${SOURCE_SHA}\` |"
            if [ -n "${before}" ]; then
              echo "| Overwriting | \`${before}\` |"
            else
              echo "| Overwriting | _nothing — the branch does not exist yet_ |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Local HEAD:  ${local_line}"
          if [ -n "${before}" ]; then
            echo "Mirror ${MIRROR_BRANCH} currently at: ${before}"
            echo "That commit becomes unreachable on the mirror after step 5."
          else
            echo "Mirror has no '${MIRROR_BRANCH}' branch yet (or is unreadable)."
            echo "If this is not a first run, check the token before continuing."
          fi

      # -----------------------------------------------------------------------
      # Step 5: Push main to the work repository
      #
      # The credential goes on the push URL rather than through
      # `git remote add`, so the token is never written into .git/config and
      # there is no cleanup step to forget.
      #
      # --force because the mirror is a reflection, not a peer: it must end up
      # at this repo's main whatever it was on before. HEAD:refs/heads/<branch>
      # rather than a bare branch name so the destination ref is explicit and
      # cannot be resolved against the remote's own configuration.
      #
      # Do NOT add `set -x` here.
      # -----------------------------------------------------------------------
      - name: Push main to the work repository
        shell: bash
        env:
          WORK_GITHUB_PAT: ${{ secrets.WORK_GITHUB_PAT }}
        run: |
          set -euo pipefail

          mirror_url="https://x-access-token:${WORK_GITHUB_PAT}@${MIRROR_HOST}/${MIRROR_OWNER}/${MIRROR_REPO}.git"

          git push --force "${mirror_url}" "HEAD:refs/heads/${MIRROR_BRANCH}"

      # -----------------------------------------------------------------------
      # Step 6: Verify the mirror now matches
      #
      # `git push` exits 0 for a no-op, and a server-side push rule can accept
      # a push while rewriting or dropping what it accepted. Without this
      # assertion the run is green whenever the command returned, which is not
      # the same claim as "the mirror is up to date".
      # -----------------------------------------------------------------------
      - name: Verify mirror matches this commit
        shell: bash
        env:
          WORK_GITHUB_PAT: ${{ secrets.WORK_GITHUB_PAT }}
        run: |
          set -euo pipefail

          mirror_url="https://x-access-token:${WORK_GITHUB_PAT}@${MIRROR_HOST}/${MIRROR_OWNER}/${MIRROR_REPO}.git"

          after="$(git ls-remote "${mirror_url}" "refs/heads/${MIRROR_BRANCH}" | cut -f1)"

          if [ -z "${after}" ]; then
            echo "FAIL: mirror has no '${MIRROR_BRANCH}' branch after the push."
            exit 1
          fi

          if [ "${after}" != "${SOURCE_SHA}" ]; then
            echo "FAIL: mirror '${MIRROR_BRANCH}' does not match this commit."
            echo "Expected: ${SOURCE_SHA}"
            echo "Got:      ${after}"
            echo "A push rule on the work repository may have rewritten or"
            echo "rejected the push without failing it."
            exit 1
          fi

          echo "OK: ${MIRROR_OWNER}/${MIRROR_REPO} ${MIRROR_BRANCH} is at ${after}."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Mirror verified at \`${after}\`." >> "$GITHUB_STEP_SUMMARY"
