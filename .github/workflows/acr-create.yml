# =============================================================================
# Provision the app-hosting prerequisites (ACR and its dependencies)
#
# Purpose:
#   Brings modules 01, 04 and 06 to their desired state, in dependency order,
#   so that a container registry exists and is writable before an application
#   pipeline tries to push an image to it:
#
#       01-resource-groups     -> 5 RGs, including rg-dev-platform
#       04-managed-identities  -> id-dev-app, in rg-dev-platform
#       06-acr                 -> rubensdevacr, plus the AcrPull role grant
#
#   Every recipe here is a `make` target from the repo-root Makefile. Nothing
#   is reimplemented: the workflow exports the ARM_* credentials the Makefile
#   header documents as its contract, and then runs the same targets a
#   maintainer runs by hand.
#
# Trigger:
#   workflow_call     — the path this workflow is SHAPED for. An application
#                       repository declares it as a job and gates its image
#                       push on it with `needs:`. No repository calls it
#                       today; it is a published interface awaiting a
#                       consumer, not a live dependency of one.
#   workflow_dispatch — manual, and currently the only path actually used.
#                       Exercises the whole thing from the Actions tab
#                       without a caller.
#
# Authentication:
#   Service Principal + client secret, read from ORGANIZATION-level Actions
#   secrets on rubensgomes-org (AZURE_CLIENT_ID / AZURE_CLIENT_SECRET /
#   AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID), shared with this repository and
#   with each calling repository.
#
#   This job is deliberately NOT bound to a GitHub Environment, unlike
#   acr-destroy.yml. Two reasons:
#
#     1. Organization secrets are not Environment secrets. A job with no
#        `environment:` resolves them fine.
#     2. For a REUSABLE workflow the `environment:` key is resolved in the
#        CALLER's repository, not this one. Binding "AZURE" here would silently
#        require every caller to define an environment of that name.
#
#   Adding an approval gate later means creating the environment in each
#   calling repo, on purpose — not inheriting one by copy-paste.
#
#   acr-destroy.yml makes the opposite call and keeps `environment: AZURE` even
#   though it too is reusable. That is not an inconsistency: forcing every
#   caller to stand up an Environment is friction, and friction is unwanted in
#   front of a create and wanted in front of a destroy.
#
#   Callers must pass the four secrets explicitly (see `secrets:` below).
#   `secrets: inherit` also works but hides which credentials cross the repo
#   boundary, which is the wrong default for an SP with subscription-wide
#   write access.
#
# Configuration:
#   TF_VAR_rg_suffix — a repository-level Actions VARIABLE (not a secret, not
#   an input). Bound at job level below; see the comment there. Unset means
#   the historical rg-<env>-<purpose> names. Set means every resource group
#   this workflow creates is named rg-<env>-<purpose>-<suffix>, and the guard
#   in step 6 refuses the run if that disagrees with the estate that already
#   exists.
#
# Notes:
#   - THE `plan-*` TARGETS GATE NOTHING. `apply-<name>` does not consume the
#     tfplan file that `plan-<name>` writes -- it re-plans internally under
#     -auto-approve. The plan steps below exist so the intended change is
#     visible in the log, and for no other reason. Do not read a clean plan
#     step as a guarantee about the apply step that follows it.
#   - `plan-<name>` and `apply-<name>` each already depend on `init-<name>`,
#     so naming all three targets re-runs `terraform init -reconfigure` three
#     times. It is idempotent and cheap (provider plugins are cached), and
#     naming them explicitly keeps these lines matching the documented
#     sequence in PROVISION_ACR.md.
#   - terraform_version must satisfy the `required_version = "~> 1.15"`
#     declared in every versions.tf in the repo. Every Terraform-touching
#     workflow in this directory pins the same build; bump them together.
#   - The teardown counterpart is acr-destroy.yml, which is reusable too and
#     removes exactly what this workflow creates -- the same three modules,
#     destroyed in reverse order (06 -> 04 -> 01). It is guarded where this one
#     is not: an actor allowlist, a typed confirmation phrase, a pre-flight
#     check that the resource groups hold nothing beyond this stack, and a
#     plan-scope assertion before each module's destroy.
#   - Keep the two in step. A resource added to modules 01, 04 or 06 is created
#     here and must be destroyable there; if it is of a new TYPE, add it to that
#     module's allowlist in acr-destroy.yml's plan-scope guard, and to the
#     pre-flight guard's allowed types if it lives in one of the five RGs.
#     Otherwise the destroy fails closed -- which is the safe direction, but it
#     fails.
#   - terraform_wrapper is false. The wrapper intercepts stdout, which would
#     break the `terraform output -raw` calls that produce this workflow's
#     outputs.
# =============================================================================

name: ACR Create (reusable)

on:
  # -------------------------------------------------------------------------
  # Reusable entry point. Callers supply the credentials; this repository
  # supplies the Terraform.
  # -------------------------------------------------------------------------
  workflow_call:
    inputs:
      environment_name:
        description: 'Estate environment to provision. Maps to the Makefile ENV variable and selects terraform/envs/<env>.'
        type: string
        required: false
        default: dev

    outputs:
      acr_name:
        description: 'Registry name, e.g. rubensdevacr. Use with `az acr login --name`.'
        value: ${{ jobs.provision.outputs.acr_name }}
      acr_login_server:
        description: 'Registry login server, e.g. rubensdevacr.azurecr.io. Use as the image reference prefix.'
        value: ${{ jobs.provision.outputs.acr_login_server }}

    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

  # -------------------------------------------------------------------------
  # Manual entry point, for running this without a caller.
  # -------------------------------------------------------------------------
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment to provision'
        type: string
        required: false
        default: dev

# Reads the repository. Creates no commits, tags or releases.
permissions:
  contents: read

jobs:
  provision:
    name: provision
    runs-on: ubuntu-latest

    # Three init/plan/apply cycles against Azure. The ceiling stops a hung
    # apply -- a Terraform state lease held by another run, say -- from
    # burning hours.
    timeout-minutes: 30

    # Serialise runs per environment so two applies never race for the same
    # state blob. The group string is shared verbatim with acr-destroy.yml so a
    # create and a destroy of the same modules cannot overlap; it is
    # lifecycle-shaped rather than verb-shaped for that reason. Never change it
    # in one file without the other.
    #
    # LIMITATION, and it matters: concurrency groups are scoped to the
    # repository that OWNS THE RUN. When this workflow is called from another
    # repository, the group is evaluated in the CALLER's namespace, so it does
    # NOT serialise against this repo's own runs of the same modules. A real
    # collision is contained by the azurerm backend's blob lease -- the second
    # run FAILS with a lock error rather than corrupting state. That is the
    # accepted failure mode. Never paper over it with -lock=false.
    concurrency:
      group: acr-lifecycle-${{ inputs.environment_name }}
      cancel-in-progress: false

    outputs:
      acr_name: ${{ steps.acr_outputs.outputs.acr_name }}
      acr_login_server: ${{ steps.acr_outputs.outputs.acr_login_server }}

    env:
      # The Makefile header states the contract: these four must be exported
      # in the shell. Declared at JOB level so every `make` step below
      # inherits them -- the recipes read the ambient environment and take no
      # arguments for credentials.
      #
      # backend.hcl sets use_azuread_auth = false, so this same SP also
      # authenticates the state blob data plane, not just the ARM control
      # plane.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Tells Terraform it is running in CI: no interactive prompts, and
      # output tuned for a log rather than a terminal.
      TF_IN_AUTOMATION: "true"

      # Single source of truth for the module roots, so the outputs step and
      # the make steps cannot drift apart.
      ENV_DIR: terraform/envs/${{ inputs.environment_name }}

      # The same input, bound once for the `make ENV=` steps below.
      #
      # This indirection is load-bearing, not style: a `${{ inputs.* }}`
      # expression written directly inside a `run:` body is substituted as raw
      # TEXT before the shell parses the script, so a value containing a quote
      # or $(...) executes on the runner. Interpolating into an `env:` VALUE
      # like this is safe -- the shell only ever sees it as a variable.
      # Reference "$ENV_NAME" from run blocks; never `${{ inputs.* }}`.
      ENV_NAME: ${{ inputs.environment_name }}

      # Optional RG-name suffix, producing rg-<env>-<purpose>-<suffix> instead
      # of rg-<env>-<purpose>. Sourced from the REPOSITORY-level Actions
      # VARIABLE of the same name (Settings > Secrets and variables > Actions
      # > Variables), not from a workflow input -- there is deliberately no
      # per-run knob and no caller-supplied value.
      #
      # Unset resolves to the empty string, which is module 01's own default
      # for `rg_suffix` AND Make's falsy value, so the historical unsuffixed
      # names stay byte-for-byte what they have always been. No conditional is
      # needed anywhere for the empty case.
      #
      # ONE binding serves both tools. Terraform reads TF_VAR_rg_suffix for
      # module 01's `rg_suffix` input; Make imports the same variable from the
      # environment to build RG_SUFFIX (Makefile:56), which names the
      # observability RG in the orphan sweep. Neither needs a second knob.
      #
      # The other eleven module roots do not declare `rg_suffix` and do not
      # need to -- they read RG names out of module 01's remote state, so the
      # suffix reaches them for free. Terraform ignores an undeclared TF_VAR_*
      # without warning, so exporting it job-wide does not disturb 04 or 06.
      #
      # THE KEY IS WRITTEN IN EXACTLY THIS CASE. GitHub variable names are
      # case-insensitive on lookup, so `vars.TF_VAR_rg_suffix` resolves however
      # the variable is stored -- but Terraform variable names are NOT.
      # TF_VAR_RG_SUFFIX would map to an undeclared variable `RG_SUFFIX` and be
      # silently ignored, producing unsuffixed names with no error anywhere.
      #
      # workflow_call caveat: `vars` is associated with the CALLER's
      # repository, so a called run reads the caller's variable rather than
      # this repository's. That is the same caller-resolution shape as the
      # `environment:` key discussed above. Nothing calls this workflow today;
      # a future caller must define its own variable of this name.
      TF_VAR_rg_suffix: ${{ vars.TF_VAR_rg_suffix }}

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository content
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # Step 2: Verify required secrets are present (fail fast)
      #
      # Why:
      #   If a caller forgets a `secrets:` entry, or the organization secret is
      #   not shared with the calling repository, the values above resolve to
      #   EMPTY STRINGS. Terraform would then fail deep inside `init` with an
      #   opaque authentication error. Fail here instead, with a message that
      #   names the cause.
      #
      # Security:
      #   Only the NAME of a missing variable is printed. Never the value.
      # -----------------------------------------------------------------------
      - name: Verify required secrets are present (no output)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret/env var: ${v}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Check the organization Actions secrets on rubensgomes-org and"
            echo "confirm they are shared with the calling repository."
          fi
          exit $missing

      # -----------------------------------------------------------------------
      # Step 3: Validate the rg_suffix repository variable (fail fast)
      #
      # Why:
      #   The value comes from a repository VARIABLE, which is edited in the
      #   GitHub UI with no review and no diff. Two failure modes are worth
      #   catching here rather than deep in a run:
      #
      #     1. A malformed value. "-blue" would produce
      #        rg-dev-observability--blue; "Blue" fails module 01's own
      #        validation, but only after init and plan have already run.
      #        Worse, Make interpolates the value into the SWEEP_ORPHANS
      #        recipe TEXT (Makefile:203-204) before the shell parses it, so
      #        a malformed value reaches a shell before Terraform ever sees it.
      #     2. A misspelled variable NAME resolves to the empty string, which
      #        is indistinguishable from "no suffix wanted". Echoing the
      #        resolved value makes the run log the record of what was used.
      #
      #   The regex is the same rule as modules/resource-groups/variables.tf's
      #   `validation` block. Keep the two in step.
      #
      # Security:
      #   "$TF_VAR_rg_suffix" is referenced as a SHELL VARIABLE. Never write
      #   `${{ vars.* }}` inside a run: body -- it is substituted as raw text
      #   before the shell parses the script. Same rule as ENV_NAME above,
      #   and enforced by main-verify.yml's `workflows` job.
      # -----------------------------------------------------------------------
      - name: GUARD - Validate rg_suffix
        shell: bash
        run: |
          set -euo pipefail
          echo "Resolved rg_suffix: '${TF_VAR_rg_suffix:-}' (empty = unsuffixed RG names)"
          if [ -n "${TF_VAR_rg_suffix:-}" ] &&
             ! printf '%s' "$TF_VAR_rg_suffix" | grep -qE '^[a-z][a-z0-9]{0,9}$'; then
            echo "FAIL: rg_suffix must be empty, or 1-10 lowercase alphanumeric"
            echo "characters starting with a letter."
            echo "Fix the TF_VAR_rg_suffix repository variable:"
            echo "  Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Step 4: Install Terraform on the runner
      #
      # Notes:
      #   - The Makefile shells out to `terraform`; it does not install it.
      #   - `make` itself is preinstalled on ubuntu-latest.
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # -----------------------------------------------------------------------
      # Step 5: Module 01 -- init only
      #
      # Split out from the plan/apply below so the drift guard in step 6 can
      # read module 01's CURRENT state before anything is planned against it.
      # `plan-resource-groups` depends on `init-resource-groups` anyway, so the
      # split costs one redundant (cached, idempotent) init and nothing else.
      # -----------------------------------------------------------------------
      - name: Module 01 - init
        shell: bash
        run: |
          make ENV="$ENV_NAME" init-resource-groups

      # -----------------------------------------------------------------------
      # Step 6: Assert the requested suffix matches what module 01 already has
      #
      # Why this guard exists:
      #   `name` is ForceNew on azurerm_resource_group. Changing rg_suffix on a
      #   LIVE estate is therefore a destroy+recreate of all five RGs, NOT a
      #   rename -- and every resource inside them belongs to a different state
      #   file that knows nothing about it. The result is a broken estate.
      #
      #   Locally that is a deliberate act by someone who read the warning in
      #   modules/resource-groups/variables.tf. Here the value arrives from a
      #   repository variable, so it can change because someone edited one
      #   field in the GitHub UI. This step turns that into a named refusal.
      #
      #   Terraform would fail the apply regardless -- the RGs hold the ACR and
      #   the UAMI, and `prevent_deletion_if_contains_resources` defaults to
      #   true -- but it fails several minutes in with an error that does not
      #   mention rg_suffix.
      #
      # Empty state means first provision (or a completed teardown), which is
      # exactly when setting a suffix IS safe. That path is allowed.
      #
      # The `${VAR:+-$VAR}` expansion mirrors `local.suffix` in
      # modules/resource-groups/main.tf -- an unset suffix contributes nothing,
      # a set one contributes a leading dash.
      # -----------------------------------------------------------------------
      - name: GUARD - Assert rg_suffix matches module 01's state
        shell: bash
        working-directory: ${{ env.ENV_DIR }}/01-resource-groups
        run: |
          set -euo pipefail
          current="$(terraform output -raw rg_platform_name 2>/dev/null || true)"
          expected="rg-${ENV_NAME}-platform${TF_VAR_rg_suffix:+-$TF_VAR_rg_suffix}"

          if [ -z "$current" ]; then
            echo "Module 01 state is empty -- first provision."
            echo "Will create ${expected} and its four siblings."
          elif [ "$current" != "$expected" ]; then
            echo "FAIL: module 01's state holds '${current}',"
            echo "      but TF_VAR_rg_suffix asks for '${expected}'."
            echo ""
            echo "rg_suffix is ForceNew on azurerm_resource_group. Applying this"
            echo "would plan a destroy+recreate of all five resource groups, not"
            echo "a rename, and every resource inside them is owned by a"
            echo "different state file that knows nothing about the change."
            echo ""
            echo "Tear the estate down first (docs/PROVISIONING_PLAN.md 15),"
            echo "then change the TF_VAR_rg_suffix repository variable."
            exit 1
          else
            echo "OK: suffix matches state (${current})."
          fi

      # -----------------------------------------------------------------------
      # Step 7: Module 01 -- the resource groups
      #
      # Creates/confirms the 5 RGs, including rg-dev-platform, which modules 04
      # and 06 place their resources into. Must run first.
      # -----------------------------------------------------------------------
      - name: Module 01 - resource groups
        shell: bash
        run: |
          make ENV="$ENV_NAME" \
            plan-resource-groups apply-resource-groups

      # -----------------------------------------------------------------------
      # Step 8: Module 04 -- the shared user-assigned managed identity
      #
      # Creates id-dev-app in rg-dev-platform. Module 06 grants AcrPull to this
      # principal, so it must exist before the registry module runs.
      # -----------------------------------------------------------------------
      - name: Module 04 - managed identities
        shell: bash
        run: |
          make ENV="$ENV_NAME" \
            init-managed-identities plan-managed-identities apply-managed-identities

      # -----------------------------------------------------------------------
      # Step 9: Module 06 -- the container registry
      #
      # Creates the registry and the AcrPull role assignment for the UAMI from
      # step 8. This is the step the calling pipeline actually depends on.
      # -----------------------------------------------------------------------
      - name: Module 06 - container registry
        shell: bash
        run: |
          make ENV="$ENV_NAME" \
            init-acr plan-acr apply-acr

      # -----------------------------------------------------------------------
      # Step 10: Publish the registry coordinates as workflow outputs
      #
      # Why:
      #   So callers reference the registry by output rather than hardcoding
      #   "rubensdevacr.azurecr.io" in an application repository. If the ACR is
      #   ever renamed in terraform.tfvars, callers follow automatically
      #   instead of failing at `docker push` with a stale hostname.
      #
      # Notes:
      #   - No `terraform init` needed: step 9 initialised this directory in
      #     the runner workspace.
      #   - -raw so the value has no surrounding quotes and can be used
      #     directly in an image reference.
      # -----------------------------------------------------------------------
      - name: Publish ACR outputs
        id: acr_outputs
        shell: bash
        working-directory: ${{ env.ENV_DIR }}/06-acr
        run: |
          set -euo pipefail
          acr_name="$(terraform output -raw acr_name)"
          acr_login_server="$(terraform output -raw acr_login_server)"
          echo "acr_name=${acr_name}"                 >> "$GITHUB_OUTPUT"
          echo "acr_login_server=${acr_login_server}" >> "$GITHUB_OUTPUT"
          echo "Registry ready: ${acr_login_server}"
