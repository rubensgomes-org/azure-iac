# =============================================================================
# Destroy the app-hosting prerequisites (ACR and its dependencies)
#
# Purpose:
#   The exact inverse of acr-create.yml. Whatever that workflow creates, this
#   one removes — the same three Terraform roots, in reverse dependency order:
#
#       06-acr                 ->  azurerm_container_registry
#                                  azurerm_role_assignment (AcrPull)
#       04-managed-identities  ->  azurerm_user_assigned_identity (id-<env>-app)
#       01-resource-groups     ->  the 5 RGs (rg-<env>-platform, -network,
#                                  -data, -app, -observability)
#
#   THE BLAST RADIUS IS THE WHOLE ACR STACK, NOT JUST THE REGISTRY. This
#   workflow used to destroy module 06 alone and leave 01 and 04 standing;
#   it no longer does. Every image, the shared identity every microservice
#   authenticates with, and all five resource groups go.
#
#   What still survives, and must:
#     * rg-tfstate / sttfstaterubens01 — the Terraform state backend. It is
#       not part of any module here and is torn down only by the manual
#       procedure in terraform/bootstrap-backend/TF_DESTROY.md. Step 12
#       asserts it is still there.
#     * Every other module's state blob. Modules 02, 03, 05, 07-12 are never
#       planned by this workflow; see the pre-flight guard below for what
#       happens if their resources are actually deployed.
#
# Trigger:
#   workflow_dispatch — the primary path. A maintainer runs this from the
#                       Actions tab and types the confirmation phrase.
#   workflow_call     — reusable, so a sibling repository can tear the stack
#                       down as a step in its own pipeline (an ephemeral-estate
#                       teardown job, say). Never a push/tag event.
#
#   Making a DESTROY reusable is a deliberate, load-bearing decision, not
#   convenience. Four guards apply identically on both paths, and none of them
#   is relaxed for a caller:
#
#     1. ALLOWED_ACTOR — `github.actor` on a called run is whoever triggered the
#        CALLER's run, so a pipeline kicked off by anyone else, by a bot, or by
#        a schedule is denied at step 2 before a credential is touched.
#     2. The typed `DESTROY ACR STACK <name>` phrase is a REQUIRED input with no
#        default on the workflow_call path. A caller has to spell the registry
#        name out in its own YAML; it cannot invoke this by accident.
#     3. The step 6 pre-flight guard refuses to run at all if the five RGs hold
#        anything beyond this stack — i.e. if the wider estate is deployed.
#     4. A per-module plan-scope guard runs before each of the three destroys
#        and fails closed on any resource type outside that module's footprint.
#
#   THE CONFIRMATION PHRASE CHANGED when the scope widened, from
#   `DESTROY ACR <name>` to `DESTROY ACR STACK <name>`. That is a breaking
#   change for any existing caller, on purpose: a phrase naming only the
#   registry would be an inaccurate description of what the run now deletes,
#   and the whole point of a type-to-confirm gate is informed consent.
#
# Relationship to acr-create.yml:
#   Now a true mirror image in SCOPE — same three modules, reversed — but
#   deliberately not in CEREMONY. acr-create is unguarded; this one is
#   quadruple-guarded. Bringing the stack back is `acr-create.yml`, or
#   `make apply-resource-groups apply-managed-identities apply-acr` locally.
#   The registry name is fixed at `rubensdevacr` in terraform.tfvars and the
#   RG and identity names are derived from `env`, so everything returns with
#   the same names and every image reference stays valid. Only the IMAGES
#   themselves are unrecoverable.
#
# Authentication:
#   Service Principal + client secret from the GitHub Environment named "AZURE",
#   rather than the organization secrets acr-create.yml uses. This is the only
#   workflow in the repo bound to an Environment.
#
#   THE ENVIRONMENT BINDING IS KEPT ON BOTH PATHS, AND THAT HAS A COST WORTH
#   UNDERSTANDING. For a reusable workflow `environment:` is resolved in the
#   CALLER's repository, so any repo that `uses:` this one must define an
#   Environment named "AZURE" itself. That is the point: a remote repository
#   cannot destroy this stack until someone has deliberately created that
#   Environment there — and can attach required reviewers to it — rather than
#   inheriting the ability by copy-pasting a `uses:` line. acr-create.yml binds
#   no Environment precisely to avoid imposing this on callers; here the
#   imposition IS the guard.
#
#   Consequently the four `secrets:` below are declared `required: false`. A
#   caller may pass them explicitly, or let its own AZURE Environment supply
#   them. Step 3 fails fast, naming the missing variable, if neither happened —
#   which is the only way a caller finds out cheaply rather than inside
#   `terraform init`.
#
# Configuration:
#   TF_VAR_rg_suffix — a repository-level Actions VARIABLE (not a secret, not
#   an input). Bound at job level below; see the comment there. It must match
#   the estate that is actually deployed: step 2 validates its shape, and
#   step 6 refuses the run if any resource group shaped like module 01's
#   carries a different suffix. The
#   value does not widen or narrow what Terraform destroys — state decides
#   that — it decides which RG the step 10 orphan sweep is aimed at.
#
# Notes:
#   - No post-destroy purge exists or is needed for the registry. Basic-SKU ACR
#     has no soft-delete, so the name is released immediately — unlike Key Vault
#     (docs/PROVISIONING_PLAN.md §15), which is module 05 and not in scope here.
#   - Step 10 runs `make purge-orphans` between modules 04 and 01. Azure creates
#     an "Application Insights Smart Detection" action group that Terraform
#     never owns, and an RG containing it cannot be deleted
#     (`prevent_deletion_if_contains_resources`). This is the same sweep the
#     repo-root `make destroy` performs between modules 02 and 01.
#   - If Container Apps (module 11) or anything else in the estate is running,
#     step 6 ABORTS THE RUN rather than warning. Deleting the RGs out from
#     under a live estate is not a partial failure — it is the destroy of
#     everything. Tear the estate down with `make destroy` first
#     (docs/PROVISIONING_PLAN.md §15).
#   - terraform_version must satisfy `required_version = "~> 1.15"` in every
#     versions.tf. Every Terraform-touching workflow in this directory pins
#     the same build; bump them together. (mirror-push.yml runs no Terraform
#     and carries no pin.)
#   - terraform_wrapper is false — the wrapper intercepts stdout and would
#     break `terraform output -raw`.
# =============================================================================

name: ACR Destroy (reusable)

on:
  # -------------------------------------------------------------------------
  # Manual entry point. The primary path.
  # -------------------------------------------------------------------------
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment to destroy the ACR stack in. Maps to the Makefile ENV variable and selects terraform/envs/<env>.'
        type: string
        required: true
        default: dev

      acr_name:
        description: 'Registry at the top of the stack. Must match acr_name in terraform/envs/<env>/06-acr/terraform.tfvars.'
        type: string
        required: true
        default: rubensdevacr

      confirm:
        description: >
          DESTROYS MODULES 06, 04 AND 01 — the registry and every image in it,
          the shared managed identity id-<env>-app, and all five resource
          groups. Basic SKU has no recycle bin and no soft-delete; push any
          image you care about elsewhere first.
          SAFEGUARD: type EXACTLY "DESTROY ACR STACK <acr_name>" — e.g. DESTROY ACR STACK rubensdevacr
        type: string
        required: true

  # -------------------------------------------------------------------------
  # Reusable entry point.
  #
  # NOTE the deliberate absence of defaults on `acr_name` and `confirm`. On the
  # dispatch path above they are prefilled so the Actions form is usable; here
  # a caller must write both out in full, which is what stops a `uses:` line
  # from being a one-word estate deletion. Keep them undefaulted.
  # -------------------------------------------------------------------------
  workflow_call:
    inputs:
      environment_name:
        description: 'Estate environment to destroy the ACR stack in. Maps to the Makefile ENV variable and selects terraform/envs/<env>.'
        type: string
        required: false
        default: dev

      acr_name:
        description: 'Registry at the top of the stack. Must match acr_name in terraform/envs/<env>/06-acr/terraform.tfvars.'
        type: string
        required: true

      confirm:
        description: 'SAFEGUARD: must be EXACTLY "DESTROY ACR STACK <acr_name>". Destroys modules 06, 04 and 01 — the registry and all its images, the shared UAMI, and all five resource groups.'
        type: string
        required: true

    # Optional because the job binds the "AZURE" Environment, which the CALLER
    # resolves — a caller with that Environment configured needs to pass
    # nothing. A caller without one must pass all four. Either way step 3
    # verifies them before Terraform runs.
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false

# Reads the repository. Creates no commits, tags or releases.
permissions:
  contents: read

jobs:
  destroy:
    name: destroy
    runs-on: ubuntu-latest

    # Three init/plan/destroy cycles. The ceiling stops a hung destroy — a
    # state lease held by another run, say — from burning hours. None of these
    # three modules is slow: ACR deletes in well under a minute, a UAMI is
    # instant, and an EMPTY resource group deletes quickly. There is no
    # PostgreSQL-style child-resource timeout problem here (module 09 is not in
    # scope; docs/PROVISIONING_PLAN.md §15).
    timeout-minutes: 30

    # Environment secrets are only injected into a job that binds the
    # Environment. Also the hook for a required-reviewer approval gate.
    #
    # On the workflow_call path this resolves in the CALLER's repository, so a
    # calling repo must define its own "AZURE" Environment. Intentional — see
    # the Authentication note in the header. Do not make this conditional on
    # `github.event_name` to spare callers the setup; that would hand every
    # `uses:` an ungated destroy.
    environment: AZURE

    # Deliberately the SAME group string as acr-create.yml: a group only
    # serialises runs that name it identically, and the run that must never
    # overlap this one is a create of the same modules. The name is
    # lifecycle-shaped rather than verb-shaped for exactly that reason — it
    # covers both directions. Change it in one file only and an apply and a
    # destroy can race for the same state blobs.
    #
    # Same caveat as acr-create.yml: groups are scoped to the repository that
    # owns the run, so a caller's create in ANOTHER repo is not serialised by
    # this — and since this workflow is reusable too, neither is a caller's
    # destroy. The azurerm blob lease is the real guard there: the loser fails
    # with a lock error. Never add -lock=false.
    concurrency:
      group: acr-lifecycle-${{ inputs.environment_name }}
      cancel-in-progress: false

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      TF_IN_AUTOMATION: "true"

      # Single source of truth for the module root paths, so the guard steps
      # and the make steps cannot drift apart.
      ENV_DIR: terraform/envs/${{ inputs.environment_name }}

      # The same input, bound once for the run blocks below.
      #
      # This indirection is load-bearing, not style: a `${{ inputs.* }}`
      # expression written directly inside a `run:` body is substituted as raw
      # TEXT before the shell parses the script, so a value containing a quote
      # or $(...) executes on the runner -- and on a workflow that DESTROYS
      # things, with the credentials already in scope. Interpolating into an
      # `env:` VALUE like this is safe: the shell only ever sees a variable.
      # Reference "$ENV_NAME" from run blocks; never `${{ inputs.* }}`.
      ENV_NAME: ${{ inputs.environment_name }}

      # Optional RG-name suffix, producing rg-<env>-<purpose>-<suffix> instead
      # of rg-<env>-<purpose>. Sourced from the REPOSITORY-level Actions
      # VARIABLE of the same name (Settings > Secrets and variables > Actions
      # > Variables), not from a workflow input — there is deliberately no
      # per-run knob and no caller-supplied value.
      #
      # Unset resolves to the empty string, which is module 01's own default
      # for `rg_suffix` AND Make's falsy value, so the historical unsuffixed
      # names stay byte-for-byte what they have always been.
      #
      # It matters MORE on the destroy path than it looks. Terraform destroys
      # what is in state, so the three module destroys below barely consult
      # it — but `make purge-orphans` builds `rg-<env>-observability<suffix>`
      # from it (Makefile:203-204) to sweep the Smart Detection action group.
      # A wrong value makes that sweep a silent no-op (`|| true`), the orphan
      # survives, and module 01's RG delete then fails on
      # `prevent_deletion_if_contains_resources`. Step 6 asserts the implied
      # RG actually exists for exactly that reason.
      #
      # THE KEY IS WRITTEN IN EXACTLY THIS CASE. GitHub variable names are
      # case-insensitive on lookup, so `vars.TF_VAR_rg_suffix` resolves however
      # the variable is stored — but Terraform variable names are NOT.
      # TF_VAR_RG_SUFFIX would map to an undeclared variable `RG_SUFFIX` and be
      # silently ignored.
      #
      # workflow_call caveat: `vars` is associated with the CALLER's
      # repository, so a called run reads the caller's variable rather than
      # this repository's — the same caller-resolution shape as `environment:`
      # above. Nothing calls this workflow today; a future caller must define
      # its own variable of this name.
      TF_VAR_rg_suffix: ${{ vars.TF_VAR_rg_suffix }}

      # Only this GitHub user may run a destructive workflow in this repo.
      # Same gate, and same value, as mirror-push.yml. Update on a rename.
      # This is the repo's only destructive workflow. The state backend has no
      # destroy workflow, deliberately — its teardown is a manual procedure
      # (terraform/bootstrap-backend/TF_DESTROY.md).
      #
      # Enforced on BOTH triggers. On workflow_call `github.actor` is the user
      # who triggered the caller's run, so a called destroy only proceeds when
      # that person is this user — a push by anyone else, or a bot/scheduled
      # trigger upstream, is denied.
      ALLOWED_ACTOR: "rubensgomes"

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository content
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # Step 2: SAFEGUARD — actor allowlist + type-to-confirm + rg_suffix shape
      #
      # Runs BEFORE any credential is used, so a failed confirmation never
      # reaches Azure at all. Identical on both triggers: a workflow_call
      # caller passes `acr_name` and `confirm` as inputs and is checked by the
      # same three comparisons a human typing into the Actions form is.
      #
      # The expected registry name is read from terraform.tfvars rather than
      # hardcoded here: terraform.tfvars is what the destroy will actually act
      # on, so comparing against anything else would let this guard pass while
      # a different registry gets torn down.
      #
      # The rg_suffix check rides along here rather than in a step of its own:
      # it is input validation, it needs no credentials, and folding it in
      # keeps the step numbering below — which several comments cross-reference
      # — stable.
      #
      # Security: only variable NAMES, the (non-secret) registry name and the
      # (non-secret) RG suffix are printed.
      # -----------------------------------------------------------------------
      - name: SAFEGUARD - Validate actor, confirmation phrase and rg_suffix
        shell: bash
        env:
          # Bound here rather than written into the script body below. A
          # `${{ ... }}` expression inside a `run:` is pasted in as raw text
          # before the shell parses it, so a crafted value breaks out of the
          # quoting and runs on the runner -- in this workflow, ahead of a
          # destroy, with the guard it is meant to be passing. Through `env:`
          # the shell only ever sees an ordinary variable.
          #
          # The comparisons below are unchanged; only how the values arrive is.
          # Do not "simplify" these back into the script.
          ACTOR: ${{ github.actor }}
          TYPED_ACR: ${{ inputs.acr_name }}
          TYPED_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          actor="${ACTOR}"
          if [ "${actor}" != "${ALLOWED_ACTOR}" ]; then
            echo "Denied: only '${ALLOWED_ACTOR}' may run this workflow. Actor: '${actor}'."
            exit 1
          fi

          tfvars="${ENV_DIR}/06-acr/terraform.tfvars"
          if [ ! -f "${tfvars}" ]; then
            echo "Denied: ${tfvars} not found."
            echo "Is environment_name='${ENV_NAME}' correct?"
            exit 1
          fi

          # acr_name = "rubensdevacr"  ->  rubensdevacr
          expected_acr="$(sed -nE 's/^[[:space:]]*acr_name[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "${tfvars}" | head -n1)"
          if [ -z "${expected_acr}" ]; then
            echo "Denied: could not read acr_name from ${tfvars}."
            exit 1
          fi

          typed_acr="${TYPED_ACR}"
          if [ "${typed_acr}" != "${expected_acr}" ]; then
            echo "Denied: acr_name mismatch."
            echo "Expected (from ${tfvars}): '${expected_acr}'"
            echo "Got:                       '${typed_acr}'"
            exit 1
          fi

          # The phrase says STACK because the run deletes modules 06, 04 AND 01.
          # It was "DESTROY ACR <name>" while the scope was module 06 alone; a
          # caller still passing the old phrase is meant to fail here and go
          # read what changed.
          expected_phrase="DESTROY ACR STACK ${expected_acr}"
          typed_phrase="${TYPED_CONFIRM}"
          if [ "${typed_phrase}" != "${expected_phrase}" ]; then
            echo "Denied: confirmation phrase did not match exactly."
            echo "Expected: ${expected_phrase}"
            echo "Got:      ${typed_phrase}"
            echo ""
            echo "NOTE: the phrase is 'DESTROY ACR STACK <name>', not 'DESTROY ACR <name>'."
            echo "It changed when this workflow's scope widened from module 06"
            echo "alone to modules 06 + 04 + 01 (registry, shared UAMI, and all"
            echo "five resource groups)."
            exit 1
          fi

          # rg_suffix arrives from a repository variable, edited in the GitHub
          # UI with no review and no diff. Validate it here, before any
          # credential is used and long before `make purge-orphans` pastes it
          # into a shell command via Make's RG_SUFFIX. Same rule as the
          # `validation` block in modules/resource-groups/variables.tf; keep
          # the two regexes in step.
          #
          # Echoed because a MISSPELLED variable name resolves to the empty
          # string, which is indistinguishable from "no suffix wanted". The run
          # log is the only record of which estate this destroy was aimed at.
          echo "Resolved rg_suffix: '${TF_VAR_rg_suffix:-}' (empty = unsuffixed RG names)"
          if [ -n "${TF_VAR_rg_suffix:-}" ] &&
             ! printf '%s' "$TF_VAR_rg_suffix" | grep -qE '^[a-z][a-z0-9]{0,9}$'; then
            echo "Denied: rg_suffix must be empty, or 1-10 lowercase alphanumeric"
            echo "characters starting with a letter."
            echo "Fix the TF_VAR_rg_suffix repository variable:"
            echo "  Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

          echo "ACR_NAME=${expected_acr}" >> "$GITHUB_ENV"
          echo "Safeguard passed. Target registry: ${expected_acr}"
          echo "Scope: module 06 (ACR) -> module 04 (UAMI) -> module 01 (5 RGs)."

      # -----------------------------------------------------------------------
      # Step 3: Verify required secrets are present (fail fast)
      #
      # If an Environment secret is missing or the Environment is misnamed, the
      # ARM_* values above resolve to EMPTY STRINGS and Terraform dies deep
      # inside init with an opaque auth error. Fail here, naming the cause.
      # -----------------------------------------------------------------------
      - name: Verify required secrets are present (no output)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret/env var: ${v}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Check the GitHub Environment named 'AZURE' and its secrets."
            echo "If this run was invoked via workflow_call, the Environment is"
            echo "resolved in the CALLING repository — define it there, or pass"
            echo "the four secrets explicitly in the caller's \`secrets:\` block."
          fi
          exit $missing

      # -----------------------------------------------------------------------
      # Step 4: Azure login — for the `az` CLI only
      #
      # Terraform does NOT need this; it reads ARM_* from the environment. The
      # az CLI is used for the pre-flight guard (step 6), the inventory
      # (step 5), the orphan sweep (step 10) and the verification (step 12).
      # -----------------------------------------------------------------------
      - name: Azure Login (Service Principal Secret)
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}

      # -----------------------------------------------------------------------
      # Step 5: Record what is about to be destroyed
      #
      # Writes the repository/tag inventory into the run log BEFORE deletion, so
      # the job output is the only surviving record of what the registry held.
      # There is no way to recover the content itself.
      #
      # Wholly informational: every command tolerates failure. A registry that
      # is already gone (a re-run of this workflow) must not fail here — the
      # Terraform destroys below are clean no-ops in that case.
      # -----------------------------------------------------------------------
      - name: Inventory repositories and tags (pre-destroy record)
        shell: bash
        run: |
          set -uo pipefail

          if ! az acr show -n "${ACR_NAME}" -o none 2>/dev/null; then
            echo "Registry '${ACR_NAME}' does not exist. Nothing to inventory."
            exit 0
          fi

          repos="$(az acr repository list -n "${ACR_NAME}" -o tsv 2>/dev/null || true)"
          if [ -z "${repos}" ]; then
            echo "Registry '${ACR_NAME}' exists and holds no repositories."
            exit 0
          fi

          echo "The following repositories and tags will be PERMANENTLY deleted:"
          echo "${repos}" | while IFS= read -r repo; do
            [ -n "${repo}" ] || continue
            tags="$(az acr repository show-tags -n "${ACR_NAME}" --repository "${repo}" -o tsv 2>/dev/null | tr '\n' ' ')"
            echo "  ${repo}: ${tags:-<untagged manifests only>}"
          done

      # -----------------------------------------------------------------------
      # Step 6: PRE-FLIGHT GUARD — the estate must be nothing but this stack
      #
      # THIS IS THE GUARD THE WIDENED SCOPE MADE NECESSARY. When this workflow
      # destroyed module 06 alone, running it against a fully deployed estate
      # was survivable: the registry went, everything else stood, and
      # `make apply-acr` put it back. Now the run also deletes the shared UAMI
      # and the five resource groups — so against a live estate it would tear
      # down the identity every microservice authenticates with, then fail at
      # the RG delete (azurerm refuses to delete a non-empty RG via
      # `prevent_deletion_if_contains_resources`) leaving the estate broken and
      # half-destroyed, with modules 02/03/05/07-12 still holding state for
      # resources whose identity is gone.
      #
      # So: enumerate everything in the five RGs and refuse to proceed if
      # anything is there beyond this stack's own footprint. Three types are
      # allowed:
      #
      #   Microsoft.ContainerRegistry/registries          — module 06
      #   Microsoft.ManagedIdentity/userAssignedIdentities — module 04
      #   microsoft.insights/actionGroups                 — an Azure-generated
      #       orphan ("Application Insights Smart Detection"), never owned by
      #       Terraform, swept in step 10. Tolerated here precisely because it
      #       is what step 10 exists to remove.
      #
      # Anything else means the estate is deployed. The fix is a full teardown
      # (`make destroy`, docs/PROVISIONING_PLAN.md §15), not a flag on this
      # workflow.
      #
      # RGs are located by the `rg-<env>-` prefix rather than by the fixed
      # five names, so an RG created with a TF_VAR_rg_suffix is still seen.
      # Over-matching is the safe direction here: an extra RG in scope makes
      # the guard MORE likely to deny, never less.
      # -----------------------------------------------------------------------
      - name: GUARD - Assert the estate holds nothing but the ACR stack
        shell: bash
        run: |
          set -euo pipefail

          # Lowercased for comparison: Azure reports provider namespaces
          # inconsistently ("microsoft.insights" vs "Microsoft.ContainerRegistry").
          allowed="microsoft.containerregistry/registries microsoft.managedidentity/userassignedidentities microsoft.insights/actiongroups"

          rgs="$(az group list --query "[?starts_with(name, 'rg-${ENV_NAME}-')].name" -o tsv)"
          if [ -z "${rgs}" ]; then
            echo "No rg-${ENV_NAME}-* resource groups exist. Nothing is deployed."
            echo "The three destroys below will be no-ops."
            exit 0
          fi

          # The configured suffix must describe the estate that is standing.
          #
          # Terraform destroys from STATE, so a mismatched suffix barely
          # affects the three module destroys below — but `make purge-orphans`
          # (step 10) builds `rg-<env>-observability<suffix>` from it, and on a
          # miss it swallows the error via `|| true`, leaves the Smart
          # Detection action group in place, and module 01's RG delete then
          # fails on `prevent_deletion_if_contains_resources` with an error
          # that says nothing about rg_suffix.
          #
          # The check is deliberately shaped as "no module-01 RG contradicts
          # the suffix" rather than "the observability RG exists". A destroy
          # that failed part-way leaves a SUBSET of the five behind, and
          # re-running is the documented way to finish it — requiring one
          # specific RG would block exactly that resume. A subset is fine; a
          # subset carrying the WRONG suffix is not.
          #
          # Only names that look like module 01's own are judged. Anything else
          # in an rg-<env>-* group is left to the contents check below, which
          # is the guard that decides whether a stranger RG is a blocker.
          #
          # `${VAR:+-$VAR}` mirrors `local.suffix` in
          # modules/resource-groups/main.tf — unset contributes nothing.
          suffix="${TF_VAR_rg_suffix:+-$TF_VAR_rg_suffix}"
          purposes="platform|network|data|app|observability"
          mismatched=""
          while IFS= read -r rg; do
            [ -n "${rg}" ] || continue
            printf '%s' "${rg}" | grep -qE "^rg-${ENV_NAME}-(${purposes})(-[a-z0-9]+)?$" || continue
            if ! printf '%s' "${rg}" | grep -qE "^rg-${ENV_NAME}-(${purposes})${suffix}$"; then
              mismatched="${mismatched}  ${rg}"$'\n'
            fi
          done <<< "${rgs}"

          if [ -n "${mismatched}" ]; then
            echo "Denied: TF_VAR_rg_suffix is '${TF_VAR_rg_suffix:-}', so module 01's resource"
            echo "groups should be named rg-${ENV_NAME}-<purpose>${suffix}. These are not:"
            printf '%s' "${mismatched}"
            echo ""
            echo "Set the TF_VAR_rg_suffix repository variable to match the estate that is"
            echo "actually deployed, then re-run. Left as it is, the step 10 orphan sweep"
            echo "would target a resource group that does not exist and silently do nothing."
            exit 1
          fi
          echo "Suffix check: every module 01 RG matches 'rg-${ENV_NAME}-<purpose>${suffix}'."

          blockers=""
          while IFS= read -r rg; do
            [ -n "${rg}" ] || continue
            echo "Resource group '${rg}':"
            contents="$(az resource list -g "${rg}" --query "[].{t:type,n:name}" -o tsv 2>/dev/null || true)"
            if [ -z "${contents}" ]; then
              echo "  (empty)"
              continue
            fi
            while IFS=$'\t' read -r type name; do
              [ -n "${type}" ] || continue
              lc="$(echo "${type}" | tr '[:upper:]' '[:lower:]')"
              case " ${allowed} " in
                *" ${lc} "*)
                  echo "  in scope: ${type}/${name}"
                  ;;
                *)
                  echo "  UNEXPECTED: ${type}/${name}"
                  blockers="${blockers}  ${rg}: ${type}/${name}"$'\n'
                  ;;
              esac
            done <<< "${contents}"
          done <<< "${rgs}"

          if [ -n "${blockers}" ]; then
            echo ""
            echo "DENIED: the resource groups hold resources this workflow does not own:"
            printf '%s' "${blockers}"
            echo ""
            echo "This workflow destroys modules 06, 04 and 01 only. Deleting the"
            echo "resource groups while the rest of the estate is deployed would"
            echo "remove the shared managed identity out from under it and then"
            echo "fail at the RG delete, leaving the estate half-destroyed."
            echo ""
            echo "Tear the estate down properly first:"
            echo "  make destroy        (see docs/PROVISIONING_PLAN.md §15)"
            exit 1
          fi

          echo ""
          echo "Guard passed: the resource groups hold nothing outside the ACR stack."

      # -----------------------------------------------------------------------
      # Step 7: Terraform, plus the per-module plan-scope guard
      #
      # Each of the three destroys below is preceded by `make plan-destroy-<n>`
      # and then by this script, which reads the resulting plan as JSON and
      # fails if it proposes deleting any resource type outside that module's
      # own footprint.
      #
      # This is belt-and-braces: each module has its own state key, and
      # `terraform destroy` can only remove what is recorded in the state it is
      # pointed at, so module 06's plan structurally cannot contain an RG. The
      # check costs nothing and turns "we believe the scope is right" into "the
      # run refuses to proceed if it isn't".
      #
      # It lives in a script written once rather than inlined three times, so
      # the three call sites cannot drift apart. `terraform show -json` is used
      # directly because no make target emits machine-readable plan output, and
      # a guard must parse the plan rather than eyeball it.
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Install the plan-scope guard
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/assert-plan-scope.sh" <<'GUARD'
          #!/usr/bin/env bash
          # assert-plan-scope.sh <module-dir> <label> <allowed-type>...
          #
          # Reads the `tfplan` that `make plan-destroy-<name>` just wrote in
          # <module-dir> and fails unless every resource it proposes to DELETE
          # is of one of the allowed types. Exits 0 with a note when the plan
          # proposes no deletions at all — that means the module is already
          # destroyed and the destroy step will be a no-op.
          set -euo pipefail

          module_dir="$1"; shift
          label="$1"; shift
          allowed="$*"

          # Written to RUNNER_TEMP, not the module directory: *tfplan* is
          # gitignored but plan.json would not be, and a JSON plan is not
          # something to risk leaving in a working tree.
          plan_json="${RUNNER_TEMP}/$(basename "${module_dir}")-destroy-plan.json"
          ( cd "${module_dir}" && terraform show -json tfplan ) > "${plan_json}"

          doomed="$(jq -r '
            .resource_changes[]?
            | select(.change.actions | index("delete"))
            | "\(.type) \(.address)"' "${plan_json}")"

          if [ -z "${doomed}" ]; then
            echo "${label}: plan proposes no deletions — already destroyed. The destroy step will be a no-op."
            exit 0
          fi

          echo "${label}: resources this run will delete:"
          echo "${doomed}" | sed 's/^/  /'

          forbidden=""
          while IFS= read -r line; do
            [ -n "${line}" ] || continue
            rtype="${line%% *}"
            case " ${allowed} " in
              *" ${rtype} "*) ;;
              *) forbidden="${forbidden}  ${line}"$'\n' ;;
            esac
          done <<< "${doomed}"

          if [ -n "${forbidden}" ]; then
            echo ""
            echo "DENIED: ${label}'s destroy plan reaches beyond its own module:"
            printf '%s' "${forbidden}"
            echo "Allowed types for this module: ${allowed}"
            echo "Aborting before any change."
            exit 1
          fi

          echo "${label}: guard passed — nothing outside this module in scope."
          GUARD
          chmod +x "${RUNNER_TEMP}/assert-plan-scope.sh"

      # -----------------------------------------------------------------------
      # Step 8: Module 06 — the container registry
      #
      # First to go: it is the top of the dependency chain. Its AcrPull role
      # assignment is scoped to the registry and references module 04's
      # identity, so it must be gone before the identity can be deleted.
      #
      # `make destroy-acr` re-inits and runs `terraform destroy -auto-approve`.
      # It does NOT consume the tfplan the plan step wrote — it re-plans
      # internally, exactly as the local `make destroy-acr` a maintainer types
      # does. The guard is therefore a check on intent, not a locked-in
      # execution plan; nothing between the two steps can change the scope,
      # since the state key and var-files are identical.
      #
      # Deleting the registry deletes all of its repositories, tags, and
      # manifests with it — there is no separate purge to run, and no
      # soft-deleted remnant to clean up on Basic SKU.
      # -----------------------------------------------------------------------
      - name: Plan the destroy - module 06 (acr)
        shell: bash
        run: |
          make ENV="$ENV_NAME" plan-destroy-acr

      - name: GUARD - Assert module 06's plan destroys only the registry
        shell: bash
        run: |
          "${RUNNER_TEMP}/assert-plan-scope.sh" \
            "${ENV_DIR}/06-acr" \
            "module 06 (acr)" \
            azurerm_container_registry azurerm_role_assignment

      - name: Destroy module 06 - container registry
        shell: bash
        run: |
          make ENV="$ENV_NAME" destroy-acr

      # -----------------------------------------------------------------------
      # Step 9: Module 04 — the shared user-assigned managed identity
      #
      # id-<env>-app. Every microservice in the ACA environment authenticates
      # to every Azure service as this principal, so deleting it is only safe
      # because step 6 proved nothing else is deployed.
      #
      # Role assignments granting it access elsewhere belong to the modules
      # that created them (06's AcrPull is already gone with the registry);
      # module 04's state holds the identity and nothing else.
      # -----------------------------------------------------------------------
      - name: Plan the destroy - module 04 (managed-identities)
        shell: bash
        run: |
          make ENV="$ENV_NAME" plan-destroy-managed-identities

      - name: GUARD - Assert module 04's plan destroys only the identity
        shell: bash
        run: |
          "${RUNNER_TEMP}/assert-plan-scope.sh" \
            "${ENV_DIR}/04-managed-identities" \
            "module 04 (managed-identities)" \
            azurerm_user_assigned_identity

      - name: Destroy module 04 - managed identities
        shell: bash
        run: |
          make ENV="$ENV_NAME" destroy-managed-identities

      # -----------------------------------------------------------------------
      # Step 10: Sweep Azure-generated orphans, before the RGs are deleted
      #
      # Creating an Application Insights component makes Azure ALSO create an
      # action group named "Application Insights Smart Detection" in the same
      # RG. Terraform never manages it, so it survives every module's destroy
      # and then blocks the RG delete below, because azurerm's
      # `prevent_deletion_if_contains_resources` (default true) refuses to
      # delete an RG containing resources it does not know about.
      #
      # `make purge-orphans` is the same sweep the repo-root `make destroy`
      # runs between modules 02 and 01. It is safe here for the same reason it
      # is safe there: by this point every Terraform-managed resource in these
      # RGs is gone, and step 6 has already proved nothing but orphans can be
      # left, so anything still standing is by definition an orphan in an RG
      # that is about to be deleted regardless.
      #
      # Normally a no-op for this stack — acr-create.yml never applies module
      # 12, so there is no App Insights component to have spawned one. It
      # matters when the estate was previously stood up in full and torn down.
      # -----------------------------------------------------------------------
      - name: Sweep Azure-generated orphans
        shell: bash
        run: |
          make ENV="$ENV_NAME" purge-orphans

      # -----------------------------------------------------------------------
      # Step 11: Module 01 — the resource groups
      #
      # Last, and the only irreversible-feeling one: all five RGs
      # (rg-<env>-platform, -network, -data, -app, -observability) go together,
      # because module 01 creates them with a single `for_each` and its state
      # holds all five.
      #
      # rg-tfstate is NOT among them. It belongs to terraform/bootstrap-backend,
      # has its own local-then-migrated state, and is never read or planned
      # here — which is what lets this workflow delete resource groups while
      # still writing its own state to one. Step 12 asserts it survived.
      # -----------------------------------------------------------------------
      - name: Plan the destroy - module 01 (resource-groups)
        shell: bash
        run: |
          make ENV="$ENV_NAME" plan-destroy-resource-groups

      - name: GUARD - Assert module 01's plan destroys only resource groups
        shell: bash
        run: |
          "${RUNNER_TEMP}/assert-plan-scope.sh" \
            "${ENV_DIR}/01-resource-groups" \
            "module 01 (resource-groups)" \
            azurerm_resource_group

      - name: Destroy module 01 - resource groups
        shell: bash
        run: |
          make ENV="$ENV_NAME" destroy-resource-groups

      # -----------------------------------------------------------------------
      # Step 12: Verify the outcome — the stack is gone, the backend is not
      #
      # Asserts BOTH halves of this workflow's contract:
      #   1. the registry, the shared UAMI and the five RGs no longer exist
      #   2. the Terraform state backend (rg-tfstate) still does
      #
      # (2) is the check that matters. This workflow deletes resource groups
      # while writing its own state into one, so a scoping mistake that reached
      # rg-tfstate would destroy the state of every module in the estate and
      # leave nothing able to `terraform init` again. Nothing plans it — but
      # the assertion is cheap and the failure mode is unrecoverable.
      # -----------------------------------------------------------------------
      - name: Verify the stack is destroyed and the state backend survives
        shell: bash
        run: |
          set -euo pipefail
          rc=0

          if az acr show -n "${ACR_NAME}" -o none 2>/dev/null; then
            echo "FAIL: registry '${ACR_NAME}' still exists."
            rc=1
          else
            echo "OK: registry '${ACR_NAME}' is gone (name released; Basic SKU has no soft-delete)."
          fi

          identity="$(az identity list --query "[?name=='id-${ENV_NAME}-app'].name" -o tsv 2>/dev/null || true)"
          if [ -n "${identity}" ]; then
            echo "FAIL: managed identity 'id-${ENV_NAME}-app' still exists."
            rc=1
          else
            echo "OK: managed identity 'id-${ENV_NAME}-app' is gone."
          fi

          remaining="$(az group list --query "[?starts_with(name, 'rg-${ENV_NAME}-')].name" -o tsv)"
          if [ -n "${remaining}" ]; then
            echo "FAIL: resource groups still exist:"
            echo "${remaining}" | sed 's/^/  /'
            rc=1
          else
            echo "OK: no rg-${ENV_NAME}-* resource groups remain."
          fi

          # The state backend must be untouched. It is not this workflow's to
          # delete — see terraform/bootstrap-backend/TF_DESTROY.md.
          if az group show -n rg-tfstate -o none 2>/dev/null; then
            echo "OK: state backend resource group 'rg-tfstate' preserved."
          else
            echo "FAIL: 'rg-tfstate' is missing — the Terraform state backend is gone."
            rc=1
          fi

          exit $rc
