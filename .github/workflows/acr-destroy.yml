# =============================================================================
# Destroy the container registry (module 06 only)
#
# Purpose:
#   Removes ONE Terraform root:
#
#       06-acr  ->  azurerm_container_registry
#                   azurerm_role_assignment (AcrPull)
#
#   THE BLAST RADIUS IS THE REGISTRY AND ITS IMAGES. Nothing else. This is
#   deliberately NOT the inverse of acr-create.yml, which applies modules 01,
#   04 and 06: the shared managed identity (id-<env>-app) and the five resource
#   groups are left standing, and any other module's resources are untouched.
#
#   Tearing down 04 and 01 as well is `make destroy-managed-identities` and
#   `make destroy-resource-groups` locally, or a full teardown with
#   `make destroy`. It is not available here,
#   on purpose.
#
#   What survives, and must:
#     * the Terraform state backend. Torn down only by the manual procedure in
#       terraform/bootstrap-backend/TF_BOOTSTRAP_DESTROY.md.
#     * Every other module's state blob and every other module's resources.
#       Only 06-acr is ever planned.
#
#   RUNNING THIS AGAINST A LIVE ESTATE IS SURVIVABLE AND REVERSIBLE. Container
#   apps configured to pull from the registry will fail to pull until it is
#   recreated (`make apply-acr` or acr-create.yml) and the images are pushed
#   again — but no state is orphaned and nothing else is deleted. That is why
#   this workflow carries no pre-flight estate check: with module 06 alone in
#   scope there is no half-destroyed outcome to guard against.
#
# Trigger:
#   workflow_dispatch — the primary path. A maintainer runs this from the
#                       Actions tab and types the confirmation phrase.
#   workflow_call     — reusable, so a sibling repository can drop the registry
#                       as a step in its own pipeline. Never a push/tag event.
#
#   Making a DESTROY reusable is a deliberate decision. Three guards apply
#   identically on both paths, and none is relaxed for a caller:
#
#     1. ALLOWED_ACTORS — `github.actor` on a called run is whoever triggered the
#        CALLER's run, so a pipeline kicked off by anyone else, by a bot, or by
#        a schedule is denied at step 2 before a credential is touched.
#     2. The typed `DESTROY ACR <name>` phrase is a REQUIRED input with no
#        default on the workflow_call path. A caller has to spell the registry
#        name out in its own YAML; it cannot invoke this by accident.
#     3. A plan-scope guard runs before the destroy and fails closed on any
#        resource type outside module 06's footprint.
#
# Relationship to acr-create.yml:
#   NOT a mirror image. acr-create.yml applies 01 -> 04 -> 06; this destroys 06.
#   Re-creating the registry afterward is `make apply-acr` locally (01 and 04
#   are still there), or a full acr-create.yml run, which no-ops on 01 and 04.
#   The registry name is an input, not a generated value, so re-running with
#   the same acr_name returns everything under the same name and every image
#   reference stays valid. Only the IMAGES themselves are unrecoverable.
#
# Authentication:
#   Service Principal identifiers come from repository-level Actions variables
#   (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID).
#   AZURE_CLIENT_SECRET is the only credential and comes from an Actions
#   secret. This is the only workflow in the repo bound to an Environment.
#
#   THE ENVIRONMENT BINDING IS KEPT ON BOTH PATHS, AND THAT HAS A COST WORTH
#   UNDERSTANDING. For a reusable workflow `environment:` is resolved in the
#   CALLER's repository, so any repo that `uses:` this one must define an
#   Environment named "AZURE" itself. That is the point: a remote repository
#   cannot destroy this registry until someone has deliberately created that
#   Environment there — and can attach required reviewers to it — rather than
#   inheriting the ability by copy-pasting a `uses:` line. acr-create.yml binds
#   no Environment precisely to avoid imposing this on callers; here the
#   imposition IS the guard.
#
#   On workflow_call, `vars.*` resolves in the caller's repository. Each caller
#   must define the three AZURE_* identifier variables there. The one secret
#   below is optional because the caller may pass AZURE_CLIENT_SECRET or let
#   its own AZURE Environment supply it. Step 4 fails fast if any required
#   value is missing rather than failing later inside `terraform init`.
#
# Notes:
#   - TF_VAR_rg_suffix is not consumed by module 06, but the post-destroy
#     verification uses it to identify this estate's resource groups without
#     confusing them with unrelated rg-<env>-* groups.
#   - TF_VAR_backend_resource_group_name identifies the state backend resource
#     group that the post-destroy verification must prove still exists.
#   - terraform_version must satisfy the `required_version = ">= 1.16.0, < 2.0"`
#     declared in every versions.tf. Every Terraform-touching workflow in this
#     directory pins the same build; bump them together.
#   - terraform_wrapper is false — the wrapper intercepts stdout and would
#     break `terraform output -raw`.
# =============================================================================

name: ACR Destroy (reusable)

on:
  # -------------------------------------------------------------------------
  # Manual entry point. The primary path.
  # -------------------------------------------------------------------------
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment holding the registry. Maps to the Makefile ENV variable and selects terraform/envs/<env>.'
        type: string
        required: true
        default: dev

      acr_name:
        description: 'Registry to destroy. Must match the acr_name recorded in module 06 state.'
        type: string
        required: true
        default: rubensdevacr

      confirm:
        description: >
          DESTROYS MODULE 06 ONLY — the registry and every image, tag and
          manifest in it. The shared managed identity and the resource groups
          are NOT touched. Basic SKU has no recycle bin and no soft-delete;
          push any image you care about elsewhere first.
          SAFEGUARD: type EXACTLY "DESTROY ACR <acr_name>" — e.g. DESTROY ACR rubensdevacr
        type: string
        required: true

  # -------------------------------------------------------------------------
  # Reusable entry point.
  #
  # NOTE the deliberate absence of defaults on `acr_name` and `confirm`. On the
  # dispatch path above they are prefilled so the Actions form is usable; here
  # a caller must write both out in full, which is what stops a `uses:` line
  # from being a one-word registry deletion. Keep them undefaulted.
  # -------------------------------------------------------------------------
  workflow_call:
    inputs:
      environment_name:
        description: 'Estate environment holding the registry. Maps to the Makefile ENV variable and selects terraform/envs/<env>.'
        type: string
        required: false
        default: dev

      acr_name:
        description: 'Registry to destroy. Must match the acr_name recorded in module 06 state.'
        type: string
        required: true

      confirm:
        description: 'SAFEGUARD: must be EXACTLY "DESTROY ACR <acr_name>". Destroys module 06 only — the registry and all its images. The shared UAMI and the resource groups are not touched.'
        type: string
        required: true

    # Optional because the job binds the "AZURE" Environment, which the CALLER
    # resolves. A caller may pass this secret explicitly or define it in that
    # Environment. The three identifiers are caller repository variables, not
    # secrets, and therefore are not part of this workflow_call contract.
    secrets:
      AZURE_CLIENT_SECRET:
        required: false

# Reads the repository. Creates no commits, tags or releases.
permissions:
  contents: read

jobs:
  destroy:
    name: destroy
    runs-on: ubuntu-latest

    # One init/plan/destroy cycle. The ceiling stops a hung destroy — a state
    # lease held by another run, say — from burning hours. ACR itself deletes
    # in well under a minute, and there is no PostgreSQL-style child-resource
    # timeout problem here (module 09 is not in scope;
    # via `make destroy`).
    timeout-minutes: 15

    # Environment secrets are only injected into a job that binds the
    # Environment. Also the hook for a required-reviewer approval gate.
    #
    # On the workflow_call path this resolves in the CALLER's repository, so a
    # calling repo must define its own "AZURE" Environment. Intentional — see
    # the Authentication note in the header. Do not make this conditional on
    # `github.event_name` to spare callers the setup; that would hand every
    # `uses:` an ungated destroy.
    environment: AZURE

    # Deliberately the SAME group string as acr-create.yml: a group only
    # serialises runs that name it identically, and the run that must never
    # overlap this one is a create of the same registry. The name is
    # lifecycle-shaped rather than verb-shaped for exactly that reason — it
    # covers both directions. Change it in one file only and an apply and a
    # destroy can race for the same state blobs.
    #
    # Same caveat as acr-create.yml: groups are scoped to the repository that
    # owns the run, so a caller's create in ANOTHER repo is not serialised by
    # this — and since this workflow is reusable too, neither is a caller's
    # destroy. The azurerm blob lease is the real guard there: the loser fails
    # with a lock error. Never add -lock=false.
    concurrency:
      group: acr-lifecycle-${{ inputs.environment_name }}
      cancel-in-progress: false

    env:
      # The three identifiers are repository Actions variables. On a reusable
      # call they resolve in the caller's repository. Only the client secret is
      # read from Actions secrets.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_rg_suffix: ${{ vars.TF_VAR_rg_suffix }}

      # Module configuration, as environment variables rather than files.
      #
      # env.tfvars and 06-acr/terraform.tfvars are gitignored (.gitignore:
      # *.tfvars) and never reach a hosted runner. This workflow used to
      # reconstruct them on disk; it no longer does. The Makefile passes
      # -var-file only when the file exists (Makefile:61), and Terraform reads
      # TF_VAR_<name> for anything a file does not supply.
      #
      # Precedence matters: -var-file OUTRANKS TF_VAR_*. These bindings are
      # authoritative on a runner only because no tfvars file is present there.
      #
      # Same raw-text rule as ENV_NAME below -- interpolate into an `env:`
      # VALUE, never into a `run:` body.
      #
      # TF_VAR_location comes from a repository VARIABLE; TF_VAR_env and
      # TF_VAR_acr_name come from workflow INPUTS, so one repository can drive
      # several environments and registries from one set of settings. The
      # repository variable is named for the Terraform variable it feeds --
      # nothing but Terraform ever reads it, and the `az` CLI steps take their
      # region from the resources themselves.
      #
      # THE KEY IS WRITTEN IN EXACTLY THIS CASE, for the reason spelled out
      # under TF_VAR_rg_suffix above: `vars.TF_VAR_location` resolves however
      # GitHub stored the name, but Terraform would read TF_VAR_LOCATION as an
      # undeclared variable `LOCATION` and ignore it without a word.
      TF_VAR_env: ${{ inputs.environment_name }}
      TF_VAR_location: ${{ vars.TF_VAR_location }}
      TF_VAR_acr_name: ${{ inputs.acr_name }}

      # Contact for the `owner` tag, overriding the `owner` key of
      # terraform/envs/dev/tags.json for this run only.
      #
      # Without this binding CI tagged everything with the committed default
      # while a local `make apply` tagged it with the operator's exported
      # TF_VAR_owner, so the same resource carried a different owner depending
      # on who applied it -- and `owner` is the contact for cost and cleanup
      # queries, the one tag worth being unambiguous.
      #
      # No `|| default` needed and no fail-fast entry: an undefined repository
      # variable resolves to the empty string, and locals.tf coalesces on the
      # first non-null, NON-EMPTY value, so an unset variable falls through to
      # tags.json exactly as it did before. That is the one place in this
      # workflow where an empty TF_VAR_ is harmless rather than dangerous.
      TF_VAR_owner: ${{ vars.TF_VAR_owner }}

      # Where module 06 READS modules 01 and 04 state from -- the `config`
      # block of its `data "terraform_remote_state"` blocks. A backend block
      # cannot take variables, so Terraform needs these told to it twice: once
      # through -backend-config for module 06's own state (Makefile:75), and
      # once as ordinary variables for the upstream reads. One set of
      # repository variables drives both.
      #
      # NO `|| default` fallback, unlike TF_VAR_rg_suffix. An undefined
      # repository variable resolves to the empty string, and an EMPTY TF_VAR_
      # still counts as a value -- it would override the module default with ""
      # and aim the state read at a nameless account. On a DESTROY workflow
      # that is the worst possible failure mode: an empty state reads as
      # "nothing exists", and the guards that compare plan scope against state
      # lose their footing. The fail-fast step below rejects it outright.
      TF_VAR_backend_resource_group_name: ${{ vars.TF_VAR_backend_resource_group_name }}
      TF_VAR_storage_account_id: ${{ vars.TF_VAR_storage_account_id }}
      TF_VAR_container_name: ${{ vars.TF_VAR_container_name }}

      TF_IN_AUTOMATION: "true"

      # Single source of truth for the module root paths, so the guard steps
      # and the make steps cannot drift apart.
      ENV_DIR: terraform/envs/${{ inputs.environment_name }}

      # The same input, bound once for the run blocks below.
      #
      # This indirection is load-bearing, not style: a `${{ inputs.* }}`
      # expression written directly inside a `run:` body is substituted as raw
      # TEXT before the shell parses the script, so a value containing a quote
      # or $(...) executes on the runner -- and on a workflow that DESTROYS
      # things, with the credentials already in scope. Interpolating into an
      # `env:` VALUE like this is safe: the shell only ever sees a variable.
      # Reference "$ENV_NAME" from run blocks; never `${{ inputs.* }}`.
      ENV_NAME: ${{ inputs.environment_name }}
      REQUESTED_ACR_NAME: ${{ inputs.acr_name }}

      # Only this GitHub account may run a destructive workflow in this repo.
      # Update on a rename; add further accounts space-separated.
      # This is the repo's only destructive workflow. The state backend has no
      # destroy workflow, deliberately — its teardown is a manual procedure
      # (terraform/bootstrap-backend/TF_BOOTSTRAP_DESTROY.md).
      #
      # Enforced on BOTH triggers. On workflow_call `github.actor` is the user
      # who triggered the caller's run, so a called destroy only proceeds when
      # that person is one of these accounts — a push by anyone else, or a
      # bot/scheduled trigger upstream, is denied.
      ALLOWED_ACTORS: "rubensgomes"

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository content
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # Step 2: SAFEGUARD — actor allowlist + type-to-confirm
      #
      # Runs BEFORE any credential is used, so a failed confirmation never
      # reaches Azure at all. Identical on both triggers: a workflow_call
      # caller passes `acr_name` and `confirm` as inputs and is checked by the
      # same two comparisons a human typing into the Actions form is.
      #
      # Security: only variable NAMES and the (non-secret) registry name are
      # printed.
      # -----------------------------------------------------------------------
      - name: SAFEGUARD - Validate actor and confirmation phrase
        shell: bash
        env:
          # Bound here rather than written into the script body below. A
          # `${{ ... }}` expression inside a `run:` is pasted in as raw text
          # before the shell parses it, so a crafted value breaks out of the
          # quoting and runs on the runner -- in this workflow, ahead of a
          # destroy, with the guard it is meant to be passing. Through `env:`
          # the shell only ever sees an ordinary variable.
          #
          # The comparisons below are unchanged; only how the values arrive is.
          # Do not "simplify" these back into the script.
          ACTOR: ${{ github.actor }}
          TYPED_ACR: ${{ inputs.acr_name }}
          TYPED_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          actor="${ACTOR}"
          allowed=false
          for allowed_actor in ${ALLOWED_ACTORS}; do
            if [ "${actor}" = "${allowed_actor}" ]; then
              allowed=true
              break
            fi
          done
          if [ "${allowed}" != "true" ]; then
            echo "Denied: this is a personal workflow currently being used by 'Rubens Gomes' only. Actor: '${actor}'."
            exit 1
          fi

          if ! printf '%s' "${ENV_NAME}" | grep -qE '^[a-z][a-z0-9]{1,9}$'; then
            echo "Denied: environment_name must be 2-10 lowercase alphanumeric"
            echo "characters starting with a letter."
            exit 1
          fi
          if ! printf '%s' "${TYPED_ACR}" | grep -qE '^[A-Za-z0-9]{5,50}$'; then
            echo "Denied: acr_name must be 5-50 alphanumeric characters."
            exit 1
          fi

          expected_acr="${TYPED_ACR}"
          # No STACK in the phrase: this run deletes module 06 and nothing
          # else. It read "DESTROY ACR STACK <name>" while the scope also
          # covered modules 04 and 01; a caller still passing that phrase is
          # meant to fail here and go read what changed.
          expected_phrase="DESTROY ACR ${expected_acr}"
          typed_phrase="${TYPED_CONFIRM}"
          if [ "${typed_phrase}" != "${expected_phrase}" ]; then
            echo "Denied: confirmation phrase did not match exactly."
            echo "Expected: ${expected_phrase}"
            echo "Got:      ${typed_phrase}"
            if [ "${typed_phrase}" = "DESTROY ACR STACK ${expected_acr}" ]; then
              echo ""
              echo "NOTE: the phrase is now 'DESTROY ACR <name>', without STACK."
              echo "It changed when this workflow's scope narrowed back to module"
              echo "06 alone. The shared UAMI (module 04) and the resource groups"
              echo "(module 01) are no longer destroyed here."
            fi
            exit 1
          fi

          echo "ACR_NAME=${expected_acr}" >> "$GITHUB_ENV"
          echo "Safeguard passed. Target registry: ${expected_acr}"
          echo "Scope: module 06 (acr) only. Modules 04 and 01 are not touched."

      # -----------------------------------------------------------------------
      # Step 3: Validate the caller-supplied Terraform inputs (fail fast)
      #
      # These values are bound into TF_VAR_env, TF_VAR_location and
      # TF_VAR_acr_name in the job `env:` block and reach Terraform directly.
      # Nothing writes them to a file first any more, so this is the only place
      # their SHAPE is checked. TF_VAR_location in particular is a repository
      # variable, edited in the GitHub UI with no review and no diff.
      #
      # The typed-confirmation guard above has already matched acr_name against
      # the phrase the operator typed, so this is a shape check, not the
      # authorization check.
      #
      # Every value is read as a SHELL variable -- never `${{ }}` inside a
      # run: body, which would substitute as raw text before the shell parses.
      # -----------------------------------------------------------------------
      - name: GUARD - Validate Terraform inputs
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "${ENV_NAME}" | grep -qE '^[a-z][a-z0-9]{1,9}$'; then
            echo "FAIL: environment_name must be 2-10 lowercase alphanumeric"
            echo "characters starting with a letter."
            exit 1
          fi
          if ! printf '%s' "${TF_VAR_location}" | grep -qE '^[a-z][a-z0-9]*$'; then
            echo "FAIL: TF_VAR_location must be a lowercase Azure region identifier"
            echo "such as 'centralus'."
            exit 1
          fi
          if ! printf '%s' "${REQUESTED_ACR_NAME}" | grep -qE '^[A-Za-z0-9]{5,50}$'; then
            echo "FAIL: acr_name must be 5-50 alphanumeric characters."
            exit 1
          fi

          echo "Validated: env='${ENV_NAME}' location='${TF_VAR_location}' acr='${REQUESTED_ACR_NAME}'."

      # -----------------------------------------------------------------------
      # Step 4: Verify required Azure configuration is present (fail fast)
      #
      # If a repository variable or the client secret is missing, the ARM_*
      # values above resolve to EMPTY STRINGS and Terraform dies deep inside
      # init with an opaque auth error. Fail here, naming the cause.
      # -----------------------------------------------------------------------
      - name: Verify required Azure configuration is present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID \
                   TF_VAR_env TF_VAR_location TF_VAR_acr_name \
                   TF_VAR_backend_resource_group_name TF_VAR_storage_account_id \
                   TF_VAR_container_name; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret/env var: ${v}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Check the calling repository's Actions configuration:"
            echo "  Variables: AZURE_CLIENT_ID, AZURE_TENANT_ID,"
            echo "             AZURE_SUBSCRIPTION_ID, TF_VAR_location,"
            echo "             TF_VAR_backend_resource_group_name, TF_VAR_rg_suffix,"
            echo "             TF_VAR_storage_account_id, TF_VAR_container_name"
            echo "  Secret:    AZURE_CLIENT_SECRET"
            echo "For workflow_call, variables resolve in the caller's repository;"
            echo "pass the secret explicitly or define it in its AZURE Environment."
          fi
          exit $missing

      - name: Validate resource naming variables
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${TF_VAR_rg_suffix:-}" ] \
             && ! printf '%s' "${TF_VAR_rg_suffix}" | grep -qE '^[a-z][a-z0-9]{0,9}$'; then
            echo "FAIL: TF_VAR_rg_suffix must be EMPTY (= no suffix, the normal"
            echo "case), or 1-10 lowercase alphanumeric characters starting with"
            echo "a letter."
            exit 1
          fi
          if [ "${TF_VAR_backend_resource_group_name: -1}" = "." ]; then
            echo "FAIL: TF_VAR_backend_resource_group_name cannot end with a period."
            exit 1
          fi
          if [ "${#TF_VAR_backend_resource_group_name}" -gt 90 ]; then
            echo "FAIL: TF_VAR_backend_resource_group_name cannot exceed 90 characters."
            exit 1
          fi

          # Backend coordinates. These name the storage account the state blobs
          # live in and the container that reads every upstream module's
          # outputs, so a typo here is not a cosmetic naming error -- it points
          # Terraform at a DIFFERENT (or nonexistent) state, where it sees an
          # empty world and proposes to create the estate a second time. The
          # regexes are Azure's own rules for the two resource types, and match
          # the `validation` blocks on the like-named Terraform variables.
          if ! printf '%s' "${TF_VAR_storage_account_id}" | grep -qE '^[a-z0-9]{3,24}$'; then
            echo "FAIL: TF_VAR_storage_account_id must be 3-24 lowercase"
            echo "alphanumeric characters (an Azure storage account name)."
            exit 1
          fi
          if ! printf '%s' "${TF_VAR_container_name}" | grep -qE '^[a-z0-9][a-z0-9-]{2,62}$'; then
            echo "FAIL: TF_VAR_container_name must be 3-63 lowercase"
            echo "alphanumeric/hyphen characters starting with alphanumeric."
            exit 1
          fi
          echo "Backend: ${TF_VAR_backend_resource_group_name}/${TF_VAR_storage_account_id}/${TF_VAR_container_name}"

      # -----------------------------------------------------------------------
      # Step 5: Azure login — for the `az` CLI only
      #
      # Terraform does NOT need this; it reads ARM_* from the environment. The
      # az CLI is used for the inventory (step 6) and the verification
      # (step 9).
      # -----------------------------------------------------------------------
      - name: Azure Login (Service Principal Secret)
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: >-
            {"clientId":"${{ vars.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "tenantId":"${{ vars.AZURE_TENANT_ID }}",
             "subscriptionId":"${{ vars.AZURE_SUBSCRIPTION_ID }}"}

      # -----------------------------------------------------------------------
      # Step 6: Record what is about to be destroyed
      #
      # Writes the repository/tag inventory into the run log BEFORE deletion, so
      # the job output is the only surviving record of what the registry held.
      # There is no way to recover the content itself.
      #
      # Wholly informational: every command tolerates failure. A registry that
      # is already gone (a re-run of this workflow) must not fail here — the
      # Terraform destroy below is a clean no-op in that case.
      # -----------------------------------------------------------------------
      - name: Inventory repositories and tags (pre-destroy record)
        shell: bash
        run: |
          set -uo pipefail

          if ! az acr show -n "${ACR_NAME}" -o none 2>/dev/null; then
            echo "Registry '${ACR_NAME}' does not exist. Nothing to inventory."
            exit 0
          fi

          repos="$(az acr repository list -n "${ACR_NAME}" -o tsv 2>/dev/null || true)"
          if [ -z "${repos}" ]; then
            echo "Registry '${ACR_NAME}' exists and holds no repositories."
            exit 0
          fi

          echo "The following repositories and tags will be PERMANENTLY deleted:"
          echo "${repos}" | while IFS= read -r repo; do
            [ -n "${repo}" ] || continue
            tags="$(az acr repository show-tags -n "${ACR_NAME}" --repository "${repo}" -o tsv 2>/dev/null | tr '\n' ' ')"
            echo "  ${repo}: ${tags:-<untagged manifests only>}"
          done

      # -----------------------------------------------------------------------
      # Step 7: Terraform, plus the plan-scope guard
      #
      # The destroy below is preceded by `make plan-destroy-acr` and then by
      # this script, which reads the resulting plan as JSON and fails if it
      # proposes deleting any resource type outside module 06's own footprint.
      #
      # This is belt-and-braces: each module has its own state key, and
      # `terraform destroy` can only remove what is recorded in the state it is
      # pointed at, so module 06's plan structurally cannot contain an RG or
      # the shared identity. The check costs nothing and turns "we believe the
      # scope is right" into "the run refuses to proceed if it isn't" — and it
      # is now the ONLY scope guard, since the pre-flight estate check went
      # with the wider blast radius.
      #
      # It stays a standalone script, taking the module directory and an
      # allowlist as arguments, so a second call site can be added without
      # copy-pasting it. `terraform show -json` is used directly because no
      # make target emits machine-readable plan output, and a guard must parse
      # the plan rather than eyeball it.
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: GUARD - Assert requested registry matches Terraform state
        shell: bash
        run: |
          set -euo pipefail

          make ENV="$ENV_NAME" init-acr
          outputs="$(cd "${ENV_DIR}/06-acr" && terraform output -json)"
          state_acr="$(jq -r '.acr_name.value // empty' <<< "${outputs}")"
          if [ -z "${state_acr}" ]; then
            echo "Module 06 state has no acr_name output; treating this as an already-destroyed run."
          elif [ "${state_acr}" != "${REQUESTED_ACR_NAME}" ]; then
            echo "DENIED: module 06 state contains registry '${state_acr}',"
            echo "but this run requested '${REQUESTED_ACR_NAME}'."
            exit 1
          else
            echo "OK: requested registry matches Terraform state (${state_acr})."
          fi

      - name: Install the plan-scope guard
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/assert-plan-scope.sh" <<'GUARD'
          #!/usr/bin/env bash
          # assert-plan-scope.sh <module-dir> <label> <allowed-type>...
          #
          # Reads the `tfplan` that `make plan-destroy-<name>` just wrote in
          # <module-dir> and fails unless every resource it proposes to DELETE
          # is of one of the allowed types. Exits 0 with a note when the plan
          # proposes no deletions at all — that means the module is already
          # destroyed and the destroy step will be a no-op.
          set -euo pipefail

          module_dir="$1"; shift
          label="$1"; shift
          allowed="$*"

          # Written to RUNNER_TEMP, not the module directory: *tfplan* is
          # gitignored but plan.json would not be, and a JSON plan is not
          # something to risk leaving in a working tree.
          plan_json="${RUNNER_TEMP}/$(basename "${module_dir}")-destroy-plan.json"
          ( cd "${module_dir}" && terraform show -json tfplan ) > "${plan_json}"

          doomed="$(jq -r '
            .resource_changes[]?
            | select(.change.actions | index("delete"))
            | "\(.type) \(.address)"' "${plan_json}")"

          if [ -z "${doomed}" ]; then
            echo "${label}: plan proposes no deletions — already destroyed. The destroy step will be a no-op."
            exit 0
          fi

          echo "${label}: resources this run will delete:"
          echo "${doomed}" | sed 's/^/  /'

          forbidden=""
          while IFS= read -r line; do
            [ -n "${line}" ] || continue
            rtype="${line%% *}"
            case " ${allowed} " in
              *" ${rtype} "*) ;;
              *) forbidden="${forbidden}  ${line}"$'\n' ;;
            esac
          done <<< "${doomed}"

          if [ -n "${forbidden}" ]; then
            echo ""
            echo "DENIED: ${label}'s destroy plan reaches beyond its own module:"
            printf '%s' "${forbidden}"
            echo "Allowed types for this module: ${allowed}"
            echo "Aborting before any change."
            exit 1
          fi

          echo "${label}: guard passed — nothing outside this module in scope."
          GUARD
          chmod +x "${RUNNER_TEMP}/assert-plan-scope.sh"

      # -----------------------------------------------------------------------
      # Step 8: Module 06 — the container registry
      #
      # The only module this workflow destroys. Its state holds the registry
      # and the AcrPull role assignment scoped to it; the identity that
      # assignment references belongs to module 04 and is left alone.
      #
      # `make destroy-acr` re-inits and runs `terraform destroy -auto-approve`.
      # It does NOT consume the tfplan the plan step wrote — it re-plans
      # internally, exactly as the local `make destroy-acr` a maintainer types
      # does. The guard is therefore a check on intent, not a locked-in
      # execution plan; nothing between the two steps can change the scope,
      # since the state key and var-files are identical.
      #
      # Deleting the registry deletes all of its repositories, tags, and
      # manifests with it — there is no separate purge to run, and no
      # soft-deleted remnant to clean up on Basic SKU.
      # -----------------------------------------------------------------------
      - name: Plan the destroy - module 06 (acr)
        shell: bash
        run: |
          make ENV="$ENV_NAME" plan-destroy-acr

      - name: GUARD - Assert module 06's plan destroys only the registry
        shell: bash
        run: |
          "${RUNNER_TEMP}/assert-plan-scope.sh" \
            "${ENV_DIR}/06-acr" \
            "module 06 (acr)" \
            azurerm_container_registry azurerm_role_assignment

      - name: Destroy module 06 - container registry
        shell: bash
        run: |
          make ENV="$ENV_NAME" destroy-acr

      # -----------------------------------------------------------------------
      # Step 9: Verify the outcome — the registry is gone, everything else is not
      #
      # Asserts all three halves of this workflow's contract:
      #   1. the registry no longer exists
      #   2. the shared UAMI and the resource groups DO still exist — this
      #      workflow is not allowed to have removed them
      #   3. the configured Terraform state backend resource group still does
      #
      # (2) is the assertion that encodes the narrowed scope. Nothing here
      # plans module 04 or 01, so it should be impossible to fail — which is
      # exactly why it is worth asserting: if it ever does fail, the scope
      # leaked. It tolerates their absence only when they were already gone
      # before the run, which step 6's own inventory cannot tell us, so the
      # check is reported as a WARNING rather than a failure in that case.
      #
      # (3) matters for the same reason it always did: a scoping mistake that
      # reached the configured backend resource group would destroy the state
      # of every module in the estate and leave nothing able to init again.
      # -----------------------------------------------------------------------
      - name: Verify the registry is destroyed and nothing else was touched
        shell: bash
        run: |
          set -euo pipefail
          rc=0

          if az acr show -n "${ACR_NAME}" -o none 2>/dev/null; then
            echo "FAIL: registry '${ACR_NAME}' still exists."
            rc=1
          else
            echo "OK: registry '${ACR_NAME}' is gone (name released; Basic SKU has no soft-delete)."
          fi

          # Module 04's identity and module 01's resource groups are NOT this
          # workflow's to delete. Their absence is not failed on — they may
          # legitimately never have been applied, or have been torn down
          # earlier by `make destroy` — but it is called out loudly, because
          # the only other way to reach that state is a scope leak here.
          platform_rg="rg-${ENV_NAME}-platform${TF_VAR_rg_suffix:+-$TF_VAR_rg_suffix}"
          identity="$(az identity show \
            --resource-group "${platform_rg}" \
            --name "id-${ENV_NAME}-app" \
            --query name -o tsv 2>/dev/null || true)"
          if [ -n "${identity}" ]; then
            echo "OK: managed identity 'id-${ENV_NAME}-app' still present in '${platform_rg}' (module 04 untouched)."
          else
            echo "WARNING: managed identity 'id-${ENV_NAME}-app' does not exist in '${platform_rg}'."
            echo "         This workflow does not destroy module 04. If it was there"
            echo "         before this run, the destroy scope leaked — investigate."
          fi

          # With an empty suffix every RG is `rg-<env>-<purpose>`, so the
          # ends_with() filter is only applied when a suffix is actually set.
          if [ -n "${TF_VAR_rg_suffix:-}" ]; then
            rg_query="[?starts_with(name, 'rg-${ENV_NAME}-') && ends_with(name, '-${TF_VAR_rg_suffix}')].name"
          else
            rg_query="[?starts_with(name, 'rg-${ENV_NAME}-')].name"
          fi
          remaining="$(az group list --query "${rg_query}" -o tsv)"
          if [ -n "${remaining}" ]; then
            echo "OK: rg-${ENV_NAME}-*${TF_VAR_rg_suffix:+-$TF_VAR_rg_suffix} resource groups still present (module 01 untouched):"
            echo "${remaining}" | sed 's/^/  /'
          else
            echo "WARNING: no rg-${ENV_NAME}-*${TF_VAR_rg_suffix:+-$TF_VAR_rg_suffix} resource groups exist."
            echo "         This workflow does not destroy module 01. If they were there"
            echo "         before this run, the destroy scope leaked — investigate."
          fi

          # The state backend must be untouched. It is not this workflow's to
          # delete — see terraform/bootstrap-backend/TF_BOOTSTRAP_DESTROY.md.
          if az group show -n "${TF_VAR_backend_resource_group_name}" -o none 2>/dev/null; then
            echo "OK: state backend resource group '${TF_VAR_backend_resource_group_name}' preserved."
          else
            echo "FAIL: '${TF_VAR_backend_resource_group_name}' is missing — the Terraform state backend is gone."
            rc=1
          fi

          exit $rc
