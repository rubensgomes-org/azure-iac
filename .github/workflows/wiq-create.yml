# =============================================================================
# Web IQ Create (reusable)
#
# Brings modules 01 (resource groups, for the ai RG) and 19 (web-iq) to
# their desired state: a global Microsoft Web IQ account in the ai RG. An
# existing account is never destroyed (only wiq-destroy.yml does). Every
# recipe is a `make` target from the repo-root Makefile. Endpoints and keys
# are never printed.
# =============================================================================

name: Web IQ Create (reusable)

on:
  workflow_call:
    inputs:
      environment_name:
        description: >-
          Estate environment to provision. Maps to the Makefile ENV
          variable and selects terraform/envs/<env>.
        type: string
        required: true

    outputs:
      web_iq_name:
        description: "Name of the Web IQ account."
        value: ${{ jobs.provision.outputs.web_iq_name }}

    secrets:
      AZURE_CLIENT_SECRET:
        required: true

  workflow_dispatch:
    inputs:
      environment_name:
        description: "Estate environment to provision"
        type: choice
        required: true
        options:
          - dev
          - lab

permissions:
  contents: read

jobs:
  provision:
    name: provision
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Must share this group string verbatim with wiq-destroy.yml.
    concurrency:
      group: wiq-lifecycle-${{ inputs.environment_name }}
      cancel-in-progress: false

    outputs:
      web_iq_name: ${{ steps.wiq_outputs.outputs.web_iq_name }}

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      TF_IN_AUTOMATION: "true"

      ROOTS_DIR: terraform/roots

      # Reference "$ENV_NAME" from run blocks; never `${{ inputs.* }}`.
      ENV_NAME: ${{ inputs.environment_name }}

      # Same fallback as every other workflow; see aca-create.yml.
      TF_VAR_workload: ${{ vars.TF_VAR_workload || 'rgomes' }}

      TF_VAR_env: ${{ inputs.environment_name }}
      TF_VAR_location: ${{ vars.TF_VAR_location }}
      TF_VAR_owner: ${{ vars.TF_VAR_owner }}

      TF_VAR_backend_resource_group_name: ${{
        vars.TF_VAR_backend_resource_group_name }}
      TF_VAR_storage_account_id: ${{ vars.TF_VAR_storage_account_id }}
      TF_VAR_container_name: ${{ vars.TF_VAR_container_name }}

    steps:
      # See aca-create.yml for why job.workflow_* is used here.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Verify required Azure configuration is present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID \
                   ARM_SUBSCRIPTION_ID TF_VAR_env TF_VAR_location \
                   TF_VAR_backend_resource_group_name \
                   TF_VAR_storage_account_id TF_VAR_container_name; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret/env var: ${v}"
              missing=1
            fi
          done
          exit $missing

      - name: GUARD - Validate Terraform inputs
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "${ENV_NAME}" | grep -qE '^[a-z][a-z0-9]{1,9}$'; then
            echo "FAIL: environment_name must be 2-10 lowercase alphanumeric"
            echo "characters starting with a letter."
            exit 1
          fi
          if ! printf '%s' "${TF_VAR_workload}" \
              | grep -qE '^[a-z][a-z0-9]{1,15}$'; then
            echo "FAIL: TF_VAR_workload must be 2-16 lowercase alphanumeric"
            echo "characters starting with a letter."
            exit 1
          fi
          echo "Validated: env='${ENV_NAME}' workload='${TF_VAR_workload}'."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      # Creates the ai RG on first run; a no-op afterwards.
      - name: Module 01 - resource groups
        shell: bash
        run: |
          make ENV="$ENV_NAME" \
            init-resource-groups plan-resource-groups apply-resource-groups

      - name: Plan module 19 - Web IQ
        shell: bash
        run: |
          make ENV="$ENV_NAME" \
            init-web-iq plan-web-iq

      - name: GUARD - Assert the plan destroys no Web IQ account
        shell: bash
        working-directory: ${{ env.ROOTS_DIR }}/19-web-iq
        run: |
          set -euo pipefail
          forbidden="$(terraform show -json tfplan | jq -r '
            .resource_changes[]?
            | select(.change.actions | index("delete"))
            | select(.type == "azapi_resource")
            | .address')"
          if [ -n "${forbidden}" ]; then
            echo "DENIED: plan destroys or replaces the Web IQ account."
            echo "Use wiq-destroy.yml to remove it:"
            while IFS= read -r address; do
              echo "  ${address}"
            done <<< "${forbidden}"
            exit 1
          fi
          echo "OK: plan destroys no Web IQ account."

      # Applies the guarded plan file, not a fresh plan.
      - name: Apply module 19 - Web IQ
        shell: bash
        working-directory: ${{ env.ROOTS_DIR }}/19-web-iq
        run: terraform apply -lock-timeout=10m tfplan

      - name: Publish Web IQ outputs
        id: wiq_outputs
        shell: bash
        working-directory: ${{ env.ROOTS_DIR }}/19-web-iq
        run: |
          set -euo pipefail
          name="$(terraform output -raw web_iq_name)"
          echo "web_iq_name=${name}" >> "$GITHUB_OUTPUT"
          echo "Web IQ account: ${name}"
