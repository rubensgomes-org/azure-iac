# =============================================================================
# Foundry Create All (reusable)
#
# Brings modules 01-08, 11, 12 and 15 to their desired state: the Container
# Apps and their dependencies, then the Foundry resource, project and,
# unless `app_insights` is off, its tracing Application Insights. Runs
# aca-create.yml and aif-create.yml in sequence; foundry-destroy-all.yml is
# its counterpart.
# =============================================================================

name: Foundry Create All (reusable)

on:
  workflow_call:
    inputs:
      environment_name:
        description: >
          Estate environment to provision. Maps to the Makefile ENV variable
          and selects terraform/envs/<env>.
        type: string
        required: true

      acr_name:
        description: 'Registry to pull images from (module 07).'
        type: string
        required: true

      apps:
        description: >
          JSON array of app names to provision, e.g. ["api","worker"].
          Defaults to the TF_VAR_apps repository variable when omitted.
        type: string
        required: false

      health_probe_paths:
        description: 'JSON map from app name to HTTP health path.'
        type: string
        required: false
        default: '{}'

      ingress_external_apps:
        description: 'JSON array of apps reachable from the VNet.'
        type: string
        required: false
        default: '[]'

      app_insights:
        description: >-
          Create the Application Insights for agent tracing. false destroys
          an existing one.
        type: boolean
        required: false
        default: true

    outputs:
      app_ids:
        description: 'JSON map from app name to full Azure Resource ID.'
        value: ${{ jobs.aca.outputs.app_ids }}
      app_names:
        description: 'JSON map from app name to deployed resource name.'
        value: ${{ jobs.aca.outputs.app_names }}
      app_fqdns:
        description: 'JSON map from app name to FQDN, or null.'
        value: ${{ jobs.aca.outputs.app_fqdns }}
      app_latest_revisions:
        description: 'JSON map from app name to latest revision name.'
        value: ${{ jobs.aca.outputs.app_latest_revisions }}
      foundry_name:
        description: 'Name of the Foundry resource.'
        value: ${{ jobs.aif.outputs.foundry_name }}
      foundry_project_name:
        description: 'Name of the Foundry project.'
        value: ${{ jobs.aif.outputs.foundry_project_name }}

    secrets:
      AZURE_CLIENT_SECRET:
        required: true

  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Estate environment to provision'
        type: choice
        required: true
        options:
          - dev
          - lab

      acr_name:
        description: 'Registry to pull images from (module 07)'
        type: choice
        required: true
        options:
          - crrgomesdev01
          - crrgomeslab02

      health_probe_paths:
        description: 'JSON map from app name to HTTP health path'
        type: string
        required: false
        default: '{}'

      ingress_external_apps:
        description: 'JSON array of apps reachable from the VNet'
        type: string
        required: false
        default: '[]'

      app_insights:
        description: 'Create Application Insights for agent tracing?'
        type: choice
        required: true
        default: 'yes'
        options:
          - 'yes'
          - 'no'

permissions:
  contents: read

# Must share this group string verbatim with foundry-destroy-all.yml.
concurrency:
  group: foundry-lifecycle-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  aca:
    name: aca
    uses: rubensgomes-org/azure-iac/.github/workflows/aca-create.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      acr_name: ${{ inputs.acr_name }}
      apps: ${{ inputs.apps }}
      health_probe_paths: ${{ inputs.health_probe_paths }}
      ingress_external_apps: ${{ inputs.ingress_external_apps }}
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  aif:
    name: aif
    needs: aca
    uses: rubensgomes-org/azure-iac/.github/workflows/aif-create.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      # workflow_call passes a boolean; workflow_dispatch passes 'yes'/'no'.
      app_insights: ${{
        inputs.app_insights == true || inputs.app_insights == 'yes' }}
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
