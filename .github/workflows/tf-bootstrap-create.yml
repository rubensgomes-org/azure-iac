# =============================================================================
# Terraform Bootstrap Backend - APPLY (manual)
#
# Purpose:
#   Creates/updates ONLY the Terraform *bootstrap backend* resources (state RG,
#   storage account, blob container, etc.) defined under:
#       terraform/bootstrap-backend
#
# Trigger:
#   Manual only (workflow_dispatch). You start it from the GitHub Actions UI.
#
# Authentication:
#   Uses Azure Service Principal + Client Secret stored in GitHub Environment
#   Secrets (Environment name: "AZURE"):
#     - AZURE_CLIENT_ID
#     - AZURE_CLIENT_SECRET
#     - AZURE_TENANT_ID
#     - AZURE_SUBSCRIPTION_ID
#
# Why this exists:
#   Bootstrap backend resources are foundational (state storage).
#   Keeping this workflow separate lets you manage backend lifecycle cleanly.
#
# Notes:
#   - Terraform automatically loads terraform.tfvars from WORKING_DIR.
#     So values like enable_rg_lock=false are applied without passing -var.
#   - This workflow uses "terraform plan -out=..." followed by
#     "terraform apply <plan>" so apply uses exactly what was planned.
#   - azure/login@v2 does NOT accept "client-secret:" as an input; for SP+secret
#     auth you must use the "creds" JSON object.
#   - The Storage Account name is a dispatch INPUT (default "sttfstaterubens01")
#     because Storage Account names are globally unique across all of Azure, so
#     a bootstrap in a different tenant/subscription cannot reuse this one. The
#     value flows to three places that must agree: the backend `init`, the
#     `-var` on plan, and the import safeguards. See the input's own comment.
# =============================================================================

name: TF Bootstrap Create

on:
  # Manual trigger only.
  workflow_dispatch:
    inputs:
      # -----------------------------------------------------------------------
      # storage_account_name
      #
      # Why this is an input and the RG / container names are not:
      #   Azure Storage Account names live in a GLOBAL namespace - they must be
      #   unique across every tenant in Azure, not just this subscription. So
      #   the default below is already taken (by this project) and anyone
      #   bootstrapping a fresh backend has to pick their own. Resource group
      #   and container names are only scoped to the subscription / account, so
      #   they stay as env constants.
      #
      # Naming rules Azure enforces (mirrored by the `storage_account_id`
      # validation block in terraform/bootstrap-backend/variables.tf, and
      # re-checked in the fail-fast step below so a bad value is rejected
      # before Azure login rather than after):
      #   - 3 to 24 characters
      #   - lowercase letters and digits only (no dashes, underscores, or caps)
      # -----------------------------------------------------------------------
      storage_account_name:
        description: "Terraform state Storage Account name (globally unique; 3-24 lowercase alphanumeric)"
        required: false
        default: "sttfstaterubens01"
        type: string

permissions:
  # Required to checkout repository content.
  contents: read

concurrency:
  # Prevent simultaneous apply/destroy runs against the same bootstrap state.
  # This helps avoid state corruption and Azure locking race conditions.
  group: terraform-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    name: Apply bootstrap backend
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------------
    # Bind the GitHub Environment named "AZURE" to this job.
    # This is REQUIRED for GitHub Environment secrets to be injected into:
    #   ${{ secrets.AZURE_CLIENT_ID }} etc.
    # -------------------------------------------------------------------------
    environment: AZURE

    env:
      # -----------------------------------------------------------------------
      # Where your bootstrap Terraform configuration lives.
      # Update if your repo path changes.
      # -----------------------------------------------------------------------
      WORKING_DIR: terraform/bootstrap-backend

      # -----------------------------------------------------------------------
      # AzureRM provider authentication (Service Principal + Secret)
      #
      # Terraform's AzureRM provider reads these ARM_* vars automatically.
      # These are populated from GitHub Environment secrets.
      # -----------------------------------------------------------------------
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Tell Terraform it's running in CI (avoids interactive prompts / improves logs)
      TF_IN_AUTOMATION: "true"

      # -----------------------------------------------------------------------
      # Bootstrap identifiers used both for documentation and safeguard validation.
      # IMPORTANT: Keep these in sync with your terraform/bootstrap-backend config.
      #
      # Naming: an EXPECTED_ prefix marks a constant that an input is validated
      # against. STORAGE_ACCOUNT_NAME has none because it is not a constant -
      # it is the dispatch input naming the account this run targets.
      # -----------------------------------------------------------------------
      EXPECTED_RG_NAME: "rg-tfstate"
      # Supplied by the dispatch input above (defaults to "sttfstaterubens01").
      # Bound here once so every step below - the fail-fast check, the backend
      # `init`, the `-var` on plan, and .github/actions/import-state - reads the
      # same value from the environment instead of repeating the expression.
      STORAGE_ACCOUNT_NAME: ${{ github.event.inputs.storage_account_name }}
      EXPECTED_CONTAINER_NAME: "tfstate"

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository content
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # Step 1.2: Validate the storage account name (fail fast)
      #
      # Why:
      #   - A malformed name would otherwise surface as an ARM 400 halfway
      #     through apply, or - worse - as a `terraform init` failure against a
      #     backend that cannot exist, which reads like a credentials problem.
      #   - Same regex as the `storage_account_id` validation in
      #     terraform/bootstrap-backend/variables.tf. Keep the two in sync.
      #
      # Note the value is read from the environment ($STORAGE_ACCOUNT_NAME),
      # NOT interpolated as a `${{ ... }}` expression inside this script: an
      # expression is pasted in as raw text before the shell parses it, so a
      # crafted input would execute on the runner with credentials in scope.
      # -----------------------------------------------------------------------
      - name: Validate storage account name
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "${STORAGE_ACCOUNT_NAME}" | grep -Eq '^[a-z0-9]{3,24}$'; then
            echo "Invalid storage_account_name: '${STORAGE_ACCOUNT_NAME}'"
            echo "Must be 3-24 characters, lowercase letters and digits only."
            exit 1
          fi
          echo "Storage account name OK: ${STORAGE_ACCOUNT_NAME}"

      # -----------------------------------------------------------------------
      # Step 1.5: Verify required secrets are present (fail fast)
      #
      # Why:
      #   - If the job is not bound to the "AZURE" environment OR a secret is missing,
      #     the values above resolve to empty strings.
      #   - We fail here with a clear message BEFORE azure/login or terraform runs.
      #
      # Security:
      #   - We do NOT print the secret values; only which variable is missing.
      # -----------------------------------------------------------------------
      - name: Verify required secrets are present (no output)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret/env var: ${v}"
              missing=1
            fi
          done
          exit $missing

      # -----------------------------------------------------------------------
      # Step 2: Azure Login (Service Principal + Client Secret)
      #
      # Notes:
      #   - For azure/login@v2, SP+secret auth must be passed via "creds" JSON.
      #   - Passing client-secret as a direct input is NOT supported in v2.
      # -----------------------------------------------------------------------
      - name: Azure Login (Service Principal Secret)
        uses: azure/login@v3
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}

      # -----------------------------------------------------------------------
      # Step 3: Install Terraform on runner
      #
      # Notes:
      #   - Must satisfy `required_version = "~> 1.15"`, declared in
      #     terraform/bootstrap-backend/versions.tf and in every other
      #     versions.tf in the repo. This pin was 1.14.3, which does NOT
      #     satisfy it — `terraform init` would have failed here.
      #   - Keep in step with .github/workflows/release.yml, which pins the
      #     same build.
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # -----------------------------------------------------------------------
      # Step 4: Check formatting
      # -----------------------------------------------------------------------
      - name: Terraform fmt (check)
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      # -----------------------------------------------------------------------
      # Step 5: terraform init
      #
      # `-backend-config="storage_account_name=..."` overrides the literal in
      # terraform/bootstrap-backend/backend.tf, which cannot interpolate a
      # variable. With the default input it supplies the same value the file
      # already hardcodes, so nothing changes; with a custom one it keeps the
      # backend pointed at the same account the rest of the run targets.
      #
      # CAVEAT - a name that does not exist yet: the azurerm backend cannot
      # init against a Storage Account that has not been created, so a genuinely
      # NEW name fails here with "Error retrieving keys for Storage Account".
      # That is the two-pass chicken-and-egg documented at the top of
      # backend.tf: bootstrap the account once with local state and
      # `terraform init -migrate-state`, then this workflow can manage it.
      # -----------------------------------------------------------------------
      - name: Terraform init (bootstrap)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init --upgrade \
            -backend-config="storage_account_name=${STORAGE_ACCOUNT_NAME}"

      # -----------------------------------------------------------------------
      # Step 6: terraform validate
      # -----------------------------------------------------------------------
      - name: Terraform validate (bootstrap)
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      # -----------------------------------------------------------------------
      # Step 7: terraform import bootstrap backend state
      # -----------------------------------------------------------------------
      - name: Terraform import backend state (bootstrap)
        uses: ./.github/actions/import-state

      # -----------------------------------------------------------------------
      # Step 8: terraform plan (save to file)
      #
      # `-var` beats the auto-loaded terraform.tfvars (a TF_VAR_ environment
      # variable would NOT - env vars are the LOWEST precedence source), so this
      # is what makes the dispatch input actually change what gets created
      # rather than only what gets imported.
      # -----------------------------------------------------------------------
      - name: Terraform plan (bootstrap)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan -out=bootstrap.tfplan \
            -var="storage_account_id=${STORAGE_ACCOUNT_NAME}"

      # -----------------------------------------------------------------------
      # Step 9: terraform apply the saved plan
      # -----------------------------------------------------------------------
      - name: Terraform apply (bootstrap)
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve bootstrap.tfplan

      # -----------------------------------------------------------------------
      # Step 9 (optional): Show outputs
      # -----------------------------------------------------------------------
      - name: Terraform outputs (bootstrap)
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform output
